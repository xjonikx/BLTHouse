<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLT House Control Panel (Extension / Pages)</title>
<script src="config.js"></script>
<script src="extension-bridge.js"></script>
<style>
:root{
  --bg:#0d0d0c;--panel:#171614;--panel2:#201e19;--panel3:#29251e;
  --line:#4d4638;--line2:#756247;--gold:#c5a360;--gold2:#ead5a4;
  --text:#e8e0cf;--muted:#9c9588;--green:#819d70;--red:#a96f64;--blue:#7694a4;
  --shadow:0 14px 40px #000b;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(circle at 52% 35%,#312b20 0,#171714 45%,#090909 100%);
  color:var(--text);font-family:Georgia,"Times New Roman",serif;overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
.app{height:100vh;display:grid;grid-template-rows:84px 50px 1fr 44px}
header{
  display:flex;align-items:center;justify-content:space-between;padding:13px 22px;
  background:linear-gradient(#2a2823,#151412);border-bottom:1px solid #6b5c42;box-shadow:0 4px 24px #000b;
}
.brand{display:flex;align-items:center;gap:13px}
.crest{
  width:50px;height:50px;display:grid;place-items:center;border:1px solid #7d6b4d;
  background:radial-gradient(circle,#574a33,#272217 68%,#131210);
  box-shadow:inset 0 0 0 3px #181612,0 0 18px #0008;color:var(--gold2);font-size:24px;
}
.title{font-size:23px;color:#eee0bf;text-shadow:0 2px 2px #000}
.subtitle{margin-top:4px;color:#999183;font:12px Arial,sans-serif}
.meta{display:flex;gap:9px;align-items:center;font:12px Arial,sans-serif}
.meta-pill{padding:8px 10px;border:1px solid #5b513f;background:#171612;color:#d2c7b1}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7fa26f;box-shadow:0 0 8px #7fa26f;margin-right:7px}
.live-dot.off{background:#a96f64;box-shadow:0 0 8px #a96f64}
.tabs{display:flex;background:linear-gradient(#27231d,#171613);border-bottom:1px solid #433d31;overflow:auto}
.tab{
  min-width:122px;border:0;border-right:1px solid #413a2f;padding:0 17px;background:transparent;color:#9e9688;position:relative;
}
.tab:hover{background:#2a261f;color:#ded2b9}
.tab.active{background:#2d281f;color:var(--gold2)}
.tab.active:after{content:"";position:absolute;left:13px;right:13px;bottom:0;height:2px;background:var(--gold);box-shadow:0 0 10px #c5a36055}
.tab.locked{opacity:.55}
.body{min-height:0;display:grid;grid-template-columns:minmax(560px,1fr) 360px}
.viewer{min-width:0;min-height:0;padding:16px}
.room-view{
  position:relative;height:100%;overflow:hidden;border:1px solid #665943;
  background:radial-gradient(circle at 50% 42%,#655b4a 0,#403c31 29%,#292820 63%,#161713 100%);
  box-shadow:inset 0 0 0 2px #0f100e,var(--shadow);
}
.room-view:before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.11) 0 1px,transparent 1px 5px),
             repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 1px,transparent 1px 6px);
}
.room-head{position:absolute;z-index:20;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.badge{padding:7px 9px;background:#141410e8;border:1px solid #63563f;color:#d1c5ad;font:11px Arial,sans-serif;box-shadow:0 2px 8px #0008}
.canvas{position:absolute;inset:52px 18px 18px}
.scene{position:absolute;inset:0;display:none}
.scene.active{display:block}
.wall{position:absolute;inset:2% 2%;border:2px solid #7b6a4e;background:linear-gradient(135deg,rgba(77,71,58,.9),rgba(32,32,28,.96));box-shadow:inset 0 0 0 1px #151511,0 10px 25px #0007}
.floor{position:absolute;left:1.5%;right:1.5%;top:18%;bottom:1.5%;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px),repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 1px,transparent 1px 22px),linear-gradient(#4c4639,#34322a);border-top:1px solid #1b1915}
.window{position:absolute;right:7%;top:5%;width:19%;height:15%;border:3px solid #514936;background:linear-gradient(#2c4049,#172228)}
.window:before,.window:after{content:"";position:absolute;background:#6e6148}
.window:before{width:2px;top:0;bottom:0;left:50%}
.window:after{height:2px;left:0;right:0;top:50%}
.object{position:absolute;z-index:8;padding:7px 8px;min-width:78px;border:1px solid #6c5c44;background:#151511de;box-shadow:0 3px 9px #0009;color:#d8cbb1;text-align:center;font:10px Arial,sans-serif;cursor:pointer}
.object:hover{border-color:#d0ad6a;color:#f0dfbb}
.object small{display:block;margin-top:3px;color:#938b7d}
.character{position:absolute;z-index:12;width:84px;text-align:center;cursor:pointer;transition:.15s}
.character:hover{transform:translateY(-2px)}
.char-sprite{width:60px;height:78px;margin:auto;position:relative;filter:drop-shadow(0 5px 4px #000a)}
.char-head{position:absolute;left:18px;top:0;width:24px;height:24px;border-radius:50%;
  background:linear-gradient(#d3aa8c,#99705b);border:1px solid #4d382e}
.char-body{position:absolute;left:10px;top:21px;width:40px;height:44px;border-radius:9px 9px 6px 6px;
  background:linear-gradient(135deg,#6e685b,#30312f);border:1px solid #49443a}
.char-leg{position:absolute;left:15px;top:61px;width:10px;height:16px;background:#20211f;border:1px solid #393631}
.char-leg.r{left:33px}
.character.female .char-body{background:linear-gradient(135deg,#6a6472,#303035)}
.character.guest .char-body{background:linear-gradient(135deg,#62565b,#303133)}
.character.selected .char-label{border-color:#d4b26a;color:#f0ddb1;box-shadow:0 0 11px #c3a05d33}
.object{
  position:absolute;z-index:8;padding:6px 8px 8px;min-width:86px;
  border:1px solid #6c5c44;background:#151511de;box-shadow:0 3px 9px #0009;color:#d8cbb1;text-align:center;
  font:10px Arial,sans-serif;cursor:pointer
}
.object:hover{border-color:#d0ad6a;color:#f0dfbb}
.object .ico{width:36px;height:36px;margin:0 auto 4px;display:block;image-rendering:auto}
.object small{display:block;margin-top:3px;color:#938b7d}
.list-item .ico{width:28px;height:28px;vertical-align:middle;margin-right:8px;border:1px solid #524839;background:#1a1814}
.locked-overlay{position:absolute;inset:0;display:grid;place-items:center;background:#0b0b0bcc;z-index:30;color:#d2c4a4}
.locked-overlay .lock-mark{
  width:54px;height:54px;border:2px solid #7a6a4a;border-radius:8px;background:#1a1814;
  display:grid;place-items:center;font:13px Arial,sans-serif;letter-spacing:1px;color:#c5a360
}
.locked-overlay span{font:14px Arial,sans-serif;margin-top:10px;color:#b5aa95;max-width:70%;text-align:center}
.tab.locked{opacity:.55}
.char-label{display:inline-block;margin-top:1px;padding:3px 6px;border:1px solid #615741;background:#171611e8;color:#e3d6bc;font:10px Arial,sans-serif}
.char-state{margin-top:3px;color:#a79f91;font:9px Arial,sans-serif}
.side{min-height:0;overflow:auto;border-left:1px solid #3c382f;background:linear-gradient(#1a1916,#121310)}
.side-section{padding:13px 14px;border-bottom:1px solid #38342c}
.kicker{font:10px Arial,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:#91897b;margin-bottom:9px}
.room-title{font-size:19px;color:#e4d5b2}
.desc{font:11px Arial,sans-serif;color:#989183;line-height:1.45;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}
.stat{border:1px solid #474138;background:#211f1a;padding:8px}
.stat span{display:block;font:10px Arial,sans-serif;color:#8c8579}.stat b{display:block;margin-top:4px;font-size:14px;font-weight:normal;color:#dfcfad}
.btns{display:grid;gap:7px}
.action{width:100%;padding:9px 10px;text-align:left;border:1px solid #524a39;background:linear-gradient(#342f24,#24221d);color:#d7c9ac}
.action:hover{border-color:#a98a57;background:linear-gradient(#463d2d,#29261f);color:#f0ddb5}
.action:disabled{opacity:.45;cursor:not-allowed}
.cost{float:right;color:#d0ac69;font-size:11px}
.hint{display:block;color:#8f887c;font:9px Arial,sans-serif;margin-top:3px}
.notice{border-left:3px solid #a88651;background:#211e17;padding:9px 10px;font:11px Arial,sans-serif;line-height:1.45;color:#c4b9a5}
.notice.ok{border-left-color:#7b9a6a}.notice.warn{border-left-color:#ad6b60}
.list{display:grid;gap:6px}
.list-item{border:1px solid #454037;background:#211f1a;padding:8px;font:11px Arial,sans-serif;color:#c1b7a4;display:flex;align-items:flex-start;gap:8px}
.list-item .txt{flex:1;min-width:0}
.list-item b{color:#e0d0ae}.list-item small{display:block;color:#90897d;margin-top:3px}
.progress{height:7px;background:#10110f;border:1px solid #443e32;margin-top:8px}.progress i{display:block;height:100%;background:#ad8950}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:100}
.modal.show{display:flex}
.modal-box{width:min(520px,90vw);background:linear-gradient(#2c2820,#171613);border:1px solid #796547;box-shadow:0 25px 75px #000d;padding:18px}
.modal-title{font-size:19px;color:#ead7ad}.modal-body{margin-top:9px;font:12px Arial,sans-serif;color:#bbb1a0;line-height:1.5}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.modal-actions button{padding:9px 13px;border:1px solid #6b5a40;background:#25211a}
.toast{position:fixed;right:18px;bottom:60px;padding:10px 13px;background:#201e18;border:1px solid #6b5b40;color:#e5d8bd;font:11px Arial,sans-serif;opacity:0;transform:translateY(10px);transition:.2s;z-index:120}
.toast.show{opacity:1;transform:translateY(0)}
.footer{display:flex;justify-content:space-between;align-items:center;padding:0 15px;background:#12110f;border-top:1px solid #3d382e;color:#817a70;font:11px Arial,sans-serif}
.error-screen{display:grid;place-items:center;height:100vh;padding:24px;text-align:center}
@media(max-width:950px){.body{grid-template-columns:1fr 320px}}
@media(max-width:760px){body{overflow:auto}.app{height:auto;min-height:100vh}.body{display:block}.viewer{height:720px}.side{border-left:0;border-top:1px solid #3c382f}}
</style>
</head>
<body>
<div class="app" id="app" style="display:none">
<header>
  <div class="brand">
    <div class="crest">⌂</div>
    <div>
      <div class="title" id="hdrTitle">Дом</div>
      <div class="subtitle" id="hdrSub">—</div>
    </div>
  </div>
  <div class="meta">
    <div class="meta-pill"><span class="live-dot" id="liveDot"></span><span id="syncLabel">Очередь</span></div>
    <div class="meta-pill">💰 <span id="gold">—</span></div>
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<div class="body">
  <section class="viewer">
    <div class="room-view">
      <div class="room-head">
        <div class="badge" id="sceneBadge">—</div>
        <div class="badge" id="sceneStatus">—</div>
      </div>
      <div class="canvas" id="canvas"></div>
    </div>
  </section>
  <aside class="side">
    <div class="side-section">
      <div class="kicker">Текущая комната</div>
      <div class="room-title" id="rightTitle">—</div>
      <div class="desc" id="rightDesc"></div>
    </div>
    <div class="side-section" id="rightContent"></div>
  </aside>
</div>
<footer class="footer">
  <span>BLTHouse · House Control Panel</span>
  <span id="footerState">Очередь · клики без чата</span>
</footer>
</div>

<div class="error-screen" id="bootError" style="display:none">
  <div>
    <div class="crest" style="margin:0 auto 16px">⌂</div>
    <div class="title" id="bootTitle">Нет данных дома</div>
    <div class="subtitle" id="bootMsg" style="max-width:480px;margin:12px auto;line-height:1.5"></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">Подтверждение</div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions">
      <button type="button" onclick="closeModal()">Отмена</button>
      <button type="button" id="modalConfirm">Подтвердить</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const TAB_DEFS = [
  {id:'common', type:'common', label:'Общая'},
  {id:'family', type:'family', label:'Семья'},
  {id:'workshop', type:'workshop', label:'Мастерская'},
  {id:'yard', type:'yard', label:'Двор'},
  {id:'storage', type:'storage', label:'Хранилище'},
  {id:'history', type:'history', label:'История'},
];

let house = null;
let currentTab = 'common';
let pendingAction = null;
let pollTimer = null;
let lastRevision = -1;

function parseRoute(){
  const path = location.pathname || '';
  const hash = (location.hash || '').replace(/^#/, '');
  const qs = new URLSearchParams(location.search);
  const hashQ = hash.indexOf('?') >= 0 ? hash.slice(hash.indexOf('?') + 1) : '';
  const hqs = new URLSearchParams(hashQ);
  const pathPart = hash.split('?')[0] || path;
  const m = pathPart.match(/\/house\/([^\/\?#]+)/i) || path.match(/\/house\/([^\/\?#]+)/i);
  return {
    houseId: m ? decodeURIComponent(m[1]) : (qs.get('house') || hqs.get('house') || ''),
    viewer: qs.get('viewer') || hqs.get('viewer') || localStorage.getItem('blt_house_viewer') || '',
  };
}

function apiBase(){
  const c = window.BLT_HOUSE_EXT || {};
  if (c.localGameApi) return String(c.localGameApi).replace(/\/$/,'');
  return '';
}

function isQueueMode(){
  const c = window.BLT_HOUSE_EXT || {};
  return !apiBase() && !!(c.ebsUrl || c.queueUrl);
}

function queueStub(houseId, viewer){
  const actions = [
    {Id:'upgrade_house', Label:'Улучшить дом', Room:'common', Available:true},
    {Id:'unlock_workshop', Label:'Построить мастерскую', Room:'workshop', Available:true},
    {Id:'upgrade_forge', Label:'Улучшить кузницу', Room:'workshop', Available:true},
    {Id:'unlock_yard', Label:'Открыть двор', Room:'yard', Available:true},
    {Id:'upgrade_stable', Label:'Улучшить конюшню', Room:'yard', Available:true},
    {Id:'expand_storage', Label:'Расширить склад', Room:'storage', Available:true},
    {Id:'unlock_guest_room', Label:'Гостевая комната', Room:'family', Available:true},
    {Id:'expand_family', Label:'Места для семьи', Room:'family', Available:true},
  ];
  return {
    HouseId: houseId,
    DisplayName: 'Дом ' + (viewer || houseId),
    OwnerPlayerId: viewer || '',
    OwnerName: viewer || '—',
    LocationName: 'в игре',
    LocationType: '—',
    HouseLevel: 1,
    HouseLevelRoman: 'I',
    StatusText: 'команды уходят в игру через очередь',
    IsOwnerViewer: true,
    Gold: 0,
    Rooms: [
      {Type:'common', Unlocked:true, Level:1, Description:'Общая'},
      {Type:'family', Unlocked:true, Level:1, Description:'Семья'},
      {Type:'workshop', Unlocked:true, Level:1, Description:'Мастерская'},
      {Type:'yard', Unlocked:true, Level:1, Description:'Двор'},
      {Type:'storage', Unlocked:true, Level:1, Description:'Склад'},
    ],
    Residents: [], Guests: [], Pets: [], Mounts: [], Furniture: [], StorageItems: [], History: [],
    Actions: actions,
    Revision: 0,
  };
}

async function fetchHouse(){
  const {houseId, viewer} = parseRoute();
  if(!houseId){
    showBoot('Укажите дом', 'Ссылка: .../index.html?house=HOUSE_ID&viewer=Ник');
    return null;
  }
  if(viewer) localStorage.setItem('blt_house_viewer', viewer);

  // Queue mode: show remote immediately; if Worker already has state — use it (no hang).
  if(isQueueMode()){
    showApp();
    if (typeof window.BLTHouseExtFetchState === 'function') {
      try {
        const remote = await window.BLTHouseExtFetchState(houseId);
        if (remote) return remote;
      } catch (e) { console.warn('state', e); }
    }
    return queueStub(houseId, viewer);
  }

  if(!apiBase()){
    showBoot('Нет связи', 'Укажи ebsUrl в config.js (Worker) или localGameApi.');
    return null;
  }

  const url = `${apiBase()}/api/house/${encodeURIComponent(houseId)}?viewer=${encodeURIComponent(viewer||'')}`;
  const r = await fetch(url, {cache:'no-store'});
  if(r.status === 503){
    showBoot('Кампания не загружена', 'Запустите Bannerlord с модулем BLTHouseExtensionTest.');
    return null;
  }
  if(r.status === 404){
    showBoot('Дом не найден', 'Купите дом: !house buy');
    return null;
  }
  if(!r.ok){
    const t = await r.text();
    showBoot('Ошибка API', t || r.statusText);
    return null;
  }
  return await r.json();
}

async function postAction(action, extra={}){
  if (typeof window.BLTHouseExtPublishAction === 'function' && isQueueMode()) {
    try {
      const prevRev = house ? (house.revision||0) : 0;
      const {houseId} = parseRoute();
      const pub = await window.BLTHouseExtPublishAction(action, extra);
      toast('Отправлено в игру');
      setFooter('Очередь: ' + action);
      document.getElementById('syncLabel').textContent = 'Ждём ответ…';
      if (typeof window.BLTHouseExtWaitState === 'function') {
        const remote = await window.BLTHouseExtWaitState(houseId, prevRev, 5000);
        if (remote) {
          house = normalize(remote);
          renderAll();
          document.getElementById('syncLabel').textContent = 'Обновлено';
          setFooter('Золото/уровень из игры');
          document.getElementById('liveDot').classList.remove('off');
          return {ok:true, msg:'queue+state', via: pub.via, house:remote};
        }
      }
      document.getElementById('syncLabel').textContent = 'Отправлено';
      document.getElementById('liveDot').classList.remove('off');
      setFooter('В игре применено; снимок ещё не пришёл (проверь QUEUE_SECRET / poll)');
      return {ok:true, msg:'queue', via: pub.via, house:null};
    } catch (e) {
      toast(String(e.message||e));
      setFooter(String(e.message||e));
      document.getElementById('liveDot').classList.add('off');
      document.getElementById('syncLabel').textContent = 'Ошибка';
      return {ok:false, msg:String(e.message||e)};
    }
  }

  if (typeof window.BLTHouseExtPublishAction === 'function' && ((window.BLT_HOUSE_EXT||{}).ebsUrl || (window.BLT_HOUSE_EXT||{}).queueUrl)) {
    try {
      const pub = await window.BLTHouseExtPublishAction(action, extra);
      toast('В очередь');
      setFooter('Queue: '+action);
      if (apiBase()) await refresh(true);
      return {ok:true, msg:'queue', house:null};
    } catch (e) {
      console.warn('queue publish failed, fallback http', e);
      if (!apiBase()) {
        toast(String(e.message||e));
        setFooter(String(e.message||e));
        return {ok:false, msg:String(e.message||e)};
      }
    }
  }

  const {houseId, viewer} = parseRoute();
  const body = Object.assign({action, viewer}, extra);
  const r = await fetch(`${apiBase()}/api/house/${encodeURIComponent(houseId)}/action`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body),
  });
  const data = await r.json().catch(()=>({Ok:false,Message:'Bad response'}));
  const ok = data.Ok ?? data.ok;
  const msg = data.Message ?? data.message ?? '';
  const h = data.House ?? data.house;
  if(ok && h){ house = normalize(h); renderAll(); }
  else if(ok){ await refresh(true); }
  toast(msg || (ok ? 'Готово' : 'Ошибка'));
  setFooter(msg);
  return {ok, msg, house:h};
}

function normalize(h){
  // Accept PascalCase from Newtonsoft
  const g = (a,b) => h[a] !== undefined ? h[a] : h[b];
  return {
    houseId: g('HouseId','houseId'),
    displayName: g('DisplayName','displayName'),
    ownerPlayerId: g('OwnerPlayerId','ownerPlayerId'),
    ownerName: g('OwnerName','ownerName'),
    locationName: g('LocationName','locationName'),
    locationType: g('LocationType','locationType'),
    houseLevel: g('HouseLevel','houseLevel'),
    houseLevelRoman: g('HouseLevelRoman','houseLevelRoman'),
    statusText: g('StatusText','statusText'),
    isOwnerViewer: g('IsOwnerViewer','isOwnerViewer'),
    gold: g('Gold','gold'),
    roomsUnlocked: g('RoomsUnlocked','roomsUnlocked'),
    residentsCount: g('ResidentsCount','residentsCount'),
    residentsCapacity: g('ResidentsCapacity','residentsCapacity'),
    guestsCount: g('GuestsCount','guestsCount'),
    guestsCapacity: g('GuestsCapacity','guestsCapacity'),
    petsCount: g('PetsCount','petsCount'),
    mountsCount: g('MountsCount','mountsCount'),
    storageUsed: g('StorageUsed','storageUsed'),
    storageCapacity: g('StorageCapacity','storageCapacity'),
    workshopLevel: g('WorkshopLevel','workshopLevel'),
    stableLevel: g('StableLevel','stableLevel'),
    yardLevel: g('YardLevel','yardLevel'),
    rooms: (g('Rooms','rooms')||[]).map(r=>({
      type:(r.Type||r.type||'').toLowerCase(),
      name:r.Name||r.name,
      unlocked:r.Unlocked??r.unlocked,
      level:r.Level??r.level,
      description:r.Description||r.description,
    })),
    residents: (g('Residents','residents')||[]).map(mapPerson),
    guests: (g('Guests','guests')||[]).map(mapPerson),
    pets: g('Pets','pets')||[],
    mounts: g('Mounts','mounts')||[],
    furniture: (g('Furniture','furniture')||[]).map(f=>({
      objectId:f.ObjectId||f.objectId,
      name:f.Name||f.name,
      room:(f.Room||f.room||'').toString().toLowerCase(),
      state:f.State||f.state,
      x:f.X??f.x, y:f.Y??f.y,
    })),
    storageItems: g('StorageItems','storageItems')||[],
    activeProject: (()=>{
      const p=g('ActiveProject','activeProject'); if(!p) return null;
      return {name:p.Name||p.name, progress:p.Progress??p.progress, daysRemaining:p.DaysRemaining??p.daysRemaining};
    })(),
    history: g('History','history')||[],
    actions: (g('Actions','actions')||[]).map(a=>({
      id:a.Id||a.id, label:a.Label||a.label, room:(a.Room||a.room||'').toLowerCase(),
      cost:a.Cost??a.cost, hint:a.Hint||a.hint, command:a.Command||a.command,
      available:a.Available??a.available, disabledReason:a.DisabledReason||a.disabledReason,
    })),
    costs: g('Costs','costs')||{},
    revision: g('Revision','revision')||0,
  };
}
function mapPerson(p){
  return {
    heroId:p.HeroId||p.heroId, name:p.Name||p.name, role:p.Role||p.role, state:p.State||p.state,
    age:p.Age??p.age, culture:p.Culture||p.culture, gender:p.Gender||p.gender,
    occupation:p.Occupation||p.occupation, portraitUrl:p.PortraitUrl||p.portraitUrl,
    cultureId:p.CultureId||p.cultureId||'', visual:p.Visual||p.visual||null,
    health:p.Health??p.health, location:p.Location||p.location, isOwner:p.IsOwner??p.isOwner,
  };
}

function roomUnlocked(type){
  const r = (house.rooms||[]).find(x=>x.type===type);
  if(type==='common'||type==='family'||type==='storage'||type==='history') return r ? r.unlocked!==false : true;
  return !!(r && r.unlocked);
}

function showBoot(title, msg){
  document.getElementById('app').style.display='none';
  document.getElementById('bootError').style.display='grid';
  document.getElementById('bootTitle').textContent=title;
  document.getElementById('bootMsg').textContent=msg;
}

function showApp(){
  document.getElementById('bootError').style.display='none';
  document.getElementById('app').style.display='grid';
}

function renderTabs(){
  const nav=document.getElementById('tabs');
  nav.innerHTML='';
  TAB_DEFS.forEach(t=>{
    const unlocked=roomUnlocked(t.type);
    const btn=document.createElement('button');
    btn.className='tab'+(currentTab===t.id?' active':'')+(unlocked?'':' locked');
    btn.textContent=unlocked?t.label:('['+t.label+']');
    btn.onclick=()=>{ currentTab=t.id; renderAll(); };
    nav.appendChild(btn);
  });
}

function renderHeader(){
  document.getElementById('hdrTitle').textContent=house.displayName||('Дом '+house.ownerName);
  document.getElementById('hdrSub').textContent=
    `${house.locationName||'—'} · ${house.locationType||''} · уровень ${house.houseLevelRoman||house.houseLevel} · ${house.isOwnerViewer?'ваша резиденция':'просмотр'}`;
  document.getElementById('gold').textContent = house.isOwnerViewer
    ? Number(house.gold||0).toLocaleString('ru-RU') : 'скрыто';
}

function renderScene(){
  const canvas=document.getElementById('canvas');
  canvas.innerHTML='';
  const scene=document.createElement('div');
  scene.className='scene active';
  scene.innerHTML='<div class="wall"></div><div class="floor"></div><div class="window"></div>';
  const unlocked=roomUnlocked(currentTab==='common'?'common':currentTab);
  if(!unlocked){
    const lock=document.createElement('div');
    lock.className='locked-overlay';
    lock.innerHTML='<div class="lock-mark">LOCK</div><span>Комната закрыта — улучшите дом или купите открытие</span>';
    scene.appendChild(lock);
  } else {
    buildSceneContent(scene, currentTab);
  }
  canvas.appendChild(scene);
  const labels={common:'Общая комната',family:'Семейная зона',workshop:'Мастерская',yard:'Двор',storage:'Хранилище',history:'История'};
  document.getElementById('sceneBadge').textContent=
    `${labels[currentTab]||currentTab} · ${house.residentsCount||0} жильцов · ${house.guestsCount||0} гостей`;
  document.getElementById('sceneStatus').textContent=
    `Уровень ${house.houseLevelRoman||house.houseLevel} · ${house.statusText||''}`;
}

function buildSceneContent(scene, tab){
  if(tab==='common'||tab==='family'){
    const furn=(house.furniture||[]).filter(f=> (f.room||'')===tab || (tab==='common' && (f.room==='common'||f.Room==='Common')));
    const fallback = tab==='common'
      ? [{name:'Камин',state:'активен',x:15,y:45},{name:'Стол',state:'свободен',x:52,y:49},{name:'Сундук',state:house.storageUsed+'/'+house.storageCapacity,x:70,y:25}]
      : [{name:'Семейный стол',state:house.familyCapacity||house.residentsCapacity,x:12,y:45},{name:'Кровати',state:house.residentsCount+'/'+house.residentsCapacity,x:70,y:48}];
    (furn.length?furn:fallback).forEach(o=>{
      const nm=o.name||o.Name||'';
      scene.appendChild(makeObject(nm, o.state||o.State||'', o.x??o.X??20, o.y??o.Y??40, iconForObject(nm)));
    });
    const people = tab==='family' ? house.residents : [...(house.residents||[]),...(house.guests||[])];
    placePeople(scene, people);
  } else if(tab==='workshop'){
    scene.appendChild(makeObject('Кузница '+(house.workshopLevel?roman(house.workshopLevel):'—'), house.workshopLevel?'работает':'нет', 10, 30, iconUrl('forge')));
    scene.appendChild(makeObject('Материалы', storageCatCount(['material','materials'])+' шт.', 43, 51, iconUrl('material')));
    scene.appendChild(makeObject('Стойка', 'инструменты', 70, 27, iconUrl('weapon')));
    placePeople(scene, (house.residents||[]).slice(0,1));
  } else if(tab==='yard'){
    scene.appendChild(makeObject('Конюшня '+(house.stableLevel?roman(house.stableLevel):'—'), (house.mountsCount||0)+' маунтов', 12, 29, iconUrl('stable')));
    (house.pets||[]).forEach((p,i)=>scene.appendChild(makeObject(p.Name||p.name||'Питомец', p.State||p.state||'', 45+i*8, 49+i*5, iconUrl('pet'))));
    (house.mounts||[]).forEach((m,i)=>scene.appendChild(makeObject(m.Name||m.name||'Маунт', m.Bond||m.bond||'', 60+i*5, 24+i*8, iconUrl('horse'))));
    if(!(house.pets||[]).length && !(house.mounts||[]).length)
      scene.appendChild(makeObject('Пустой двор', 'заведите животных', 50, 55, iconUrl('stable')));
  } else if(tab==='storage'){
    const cats={};
    (house.storageItems||[]).forEach(it=>{
      const c=(it.Category||it.category||'misc');
      cats[c]=(cats[c]||0)+(it.Count||it.count||1);
    });
    const entries=Object.keys(cats).length?Object.entries(cats):[['пусто',0]];
    entries.slice(0,6).forEach(([k,v],i)=>{
      const x=14+(i%3)*29, y=i<3?25:61;
      scene.appendChild(makeObject(k, v+' шт.', x, y, iconUrl(iconKey(k))));
    });
  } else if(tab==='history'){
    (house.history||[]).slice(0,6).forEach((h,i)=>{
      const text=h.Text||h.text||'';
      const x=12+(i%3)*30, y=i<3?27:60;
      scene.appendChild(makeObject('Запись', text.substring(0,28), x, y, iconUrl('history')));
    });
  }
}

function storageCatCount(keys){
  return (house.storageItems||[]).filter(i=>{
    const c=(i.Category||i.category||'').toLowerCase();
    return keys.some(k=>c.includes(k));
  }).reduce((s,i)=>s+(i.Count||i.count||1),0);
}

function iconUrl(key){
  return '/assets/icons/'+encodeURIComponent(key||'misc')+'.svg';
}
function iconKey(type){
  const t=String(type||'').toLowerCase();
  if(t.includes('weapon')||t.includes('polearm')||t.includes('bow')||t.includes('инструмент')) return 'weapon';
  if(t.includes('armor')||t.includes('shield')||t.includes('cape')) return 'armor';
  if(t.includes('horse')||t.includes('маунт')||t.includes('кон')) return 'horse';
  if(t.includes('food')||t.includes('grain')||t.includes('еда')) return 'food';
  if(t.includes('material')||t.includes('tool')||t.includes('матер')) return 'material';
  if(t.includes('pet')||t.includes('питом')) return 'pet';
  if(t.includes('stable')||t.includes('конюш')||t.includes('двор')) return 'stable';
  if(t.includes('forge')||t.includes('кузн')||t.includes('мастер')) return 'forge';
  if(t.includes('chest')||t.includes('сундук')||t.includes('хран')) return 'chest';
  if(t.includes('fire')||t.includes('камин')) return 'fireplace';
  if(t.includes('table')||t.includes('стол')) return 'table';
  if(t.includes('bed')||t.includes('кроват')) return 'bed';
  if(t.includes('history')||t.includes('запис')) return 'history';
  return 'misc';
}
function iconForObject(name){
  return iconUrl(iconKey(name));
}

function makeObject(name, state, x, y, icon){
  const d=document.createElement('div');
  d.className='object';
  d.style.left=x+'%'; d.style.top=y+'%';
  const src=icon||iconForObject(name);
  d.innerHTML=`<img class="ico" src="${esc(src)}" alt=""><div>${esc(name)}</div><small>${esc(String(state))}</small>`;
  d.onclick=()=>{ setFooter(name+' — '+state); toast(name+': '+state); };
  return d;
}

function placePeople(scene, people){
  const slots=[[20,28],[62,18],[45,62],[30,50],[70,40]];
  (people||[]).slice(0,5).forEach((p,i)=>{
    const [x,y]=slots[i]||[10+i*12,35];
    const el=document.createElement('div');
    const isGuest=!!(p.isGuest||p.IsGuest||String(p.role||p.Role||'').toLowerCase().includes('гост'));
    const gender=String(p.gender||p.Gender||'').toLowerCase();
    const isFemale=gender==='female'||!!(p.isFemale||p.IsFemale||p.female);
    el.className='character'+(p.isOwner||p.IsOwner?' selected':'')+(isGuest?' guest':'')+(isFemale?' female':'');
    el.style.left=x+'%'; el.style.top=y+'%';
    el.title=p.heroId||p.HeroId||'';
    el.innerHTML=`<div class="char-sprite"><div class="char-head"></div><div class="char-body"></div><div class="char-leg"></div><div class="char-leg r"></div></div><div class="char-label">${esc(p.name||p.Name||'?')}</div><div class="char-state">${esc(p.state||p.State||p.role||p.Role||'')}</div>`;
    el.onclick=()=>inspectPerson(p);
    scene.appendChild(el);
  });
}

function inspectPerson(p){
  const bits=[p.role,p.age?`возраст ${p.age}`:'',p.culture,p.occupation,p.location].filter(Boolean);
  setFooter(`${p.name} — ${bits.join(' · ')}`);
  toast(p.name+': '+(p.state||''));
}

function renderSide(){
  const titles={common:'Общая',family:'Семья',workshop:'Мастерская',yard:'Двор',storage:'Хранилище',history:'История'};
  const descs={
    common:'Главная комната дома. Жильцы, гости и общие объекты.',
    family:'Жильцы и семейная часть дома.',
    workshop:'Рабочая зона и кузница.',
    yard:'Животные, маунты и хозяйство.',
    storage:'Личные предметы и запасы.',
    history:'Хроника изменений дома.',
  };
  document.getElementById('rightTitle').textContent=titles[currentTab]||currentTab;
  document.getElementById('rightDesc').textContent=descs[currentTab]||'';
  const box=document.getElementById('rightContent');
  let html='';
  if(!roomUnlocked(currentTab)){
    html=`<div class="notice warn">Комната закрыта. Используйте действия улучшения дома или откройте комнату отдельно.</div>
      <div style="margin-top:12px" class="kicker">Действия</div><div class="btns">${actionsHtml(currentTab)}</div>`;
  } else if(currentTab==='common'){
    html=`<div class="kicker">Состояние</div>
      <div class="notice ok">${esc(house.statusText||'OK')}</div>
      <div class="grid">
        <div class="stat"><span>УРОВЕНЬ</span><b>${esc(house.houseLevelRoman||house.houseLevel)}</b></div>
        <div class="stat"><span>КОМНАТ</span><b>${house.roomsUnlocked||0}</b></div>
        <div class="stat"><span>ГОСТИ</span><b>${house.guestsCount||0}/${house.guestsCapacity||0}</b></div>
        <div class="stat"><span>ХРАНИЛИЩЕ</span><b>${house.storageUsed||0}/${house.storageCapacity||0}</b></div>
      </div>
      ${projectHtml()}
      <div style="margin-top:12px" class="kicker">Действия</div><div class="btns">${actionsHtml('common')}</div>`;
  } else if(currentTab==='family'){
    html=`<div class="kicker">Жильцы</div><div class="list">${peopleList(house.residents)}</div>
      <div style="margin-top:12px" class="kicker">Гости</div><div class="list">${peopleList(house.guests)||'<div class="list-item">Нет гостей</div>'}</div>
      <div style="margin-top:12px" class="btns">${actionsHtml('family')}</div>`;
  } else if(currentTab==='workshop'){
    html=`<div class="kicker">Кузница</div>
      <div class="grid">
        <div class="stat"><span>УРОВЕНЬ</span><b>${roman(house.workshopLevel||0)}</b></div>
        <div class="stat"><span>МАТЕРИАЛЫ</span><b>${storageCatCount(['material'])}</b></div>
      </div>
      <div style="margin-top:12px" class="btns">${actionsHtml('workshop')}</div>`;
  } else if(currentTab==='yard'){
    html=`<div class="kicker">Животные</div><div class="list">${yardList()}</div>
      <div style="margin-top:12px" class="btns">${actionsHtml('yard')}</div>`;
  } else if(currentTab==='storage'){
    const pct=house.storageCapacity?Math.round(100*(house.storageUsed||0)/house.storageCapacity):0;
    html=`<div class="kicker">Заполненность</div>
      <div class="stat"><span>СЛОТЫ</span><b>${house.storageUsed||0} / ${house.storageCapacity||0}</b></div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div style="margin-top:12px" class="kicker">Предметы</div>
      <div class="list">${storageList()}</div>
      <div style="margin-top:12px" class="btns">${actionsHtml('storage')}</div>`;
  } else if(currentTab==='history'){
    html=`<div class="kicker">История</div><div class="list">${historyList()}</div>
      <div style="margin-top:12px" class="btns">${actionsHtml('history')}</div>`;
  }
  box.innerHTML=html;
}

function projectHtml(){
  const p=house.activeProject; if(!p) return '';
  const pr=Math.round(p.progress||0);
  return `<div style="margin-top:12px" class="kicker">Проект</div>
    <div class="notice warn">${esc(p.name)} · ${pr}% · осталось ~${(p.daysRemaining||0).toFixed(1)} дн.</div>
    <div class="progress"><i style="width:${pr}%"></i></div>`;
}

function peopleList(arr){
  return (arr||[]).map(p=>`<div class="list-item"><img class="ico" src="${iconUrl('person')}" alt=""><div class="txt"><b>${esc(p.name)}</b> — ${esc(p.role||'')}<small>${esc(p.state||'')} · ${esc(p.culture||'')} · ${p.age||'?'} лет</small></div></div>`).join('');
}
function yardList(){
  const a=[];
  (house.mounts||[]).forEach(m=>a.push(`<div class="list-item"><img class="ico" src="${iconUrl('horse')}" alt=""><div class="txt"><b>${esc(m.Name||m.name)}</b><small>${esc(m.Bond||m.bond||'')} · ${esc(m.State||m.state||'')}</small></div></div>`));
  (house.pets||[]).forEach(p=>a.push(`<div class="list-item"><img class="ico" src="${iconUrl('pet')}" alt=""><div class="txt"><b>${esc(p.Name||p.name)}</b><small>${esc(p.Kind||p.kind||'')} · ${esc(p.State||p.state||'')}</small></div></div>`));
  return a.join('')||'<div class="list-item">Пока пусто</div>';
}
function storageList(){
  return (house.storageItems||[]).slice(0,20).map(it=>{
    const name=it.Name||it.name||it.ItemStringId||it.itemStringId;
    const id=it.ItemStringId||it.itemStringId||'';
    const type=it.ItemType||it.itemType||it.Category||it.category||'';
    const cnt=it.Count||it.count||1;
    const icon=it.IconUrl||it.iconUrl||iconUrl(iconKey(type));
    const src=String(icon).startsWith('/assets/icons/')?icon:iconUrl(iconKey(type));
    return `<div class="list-item"><img class="ico" src="${esc(src)}" alt=""><div class="txt"><b>${esc(name)}</b><small>×${cnt} · ${esc(type||'item')} · ${esc(id)}</small></div></div>`;
  }).join('')||'<div class="list-item">Пусто</div>';
}
function historyList(){
  return (house.history||[]).slice(0,25).map(h=>{
    const t=h.Text||h.text||'';
    const day=Math.floor(h.CampaignDays||h.campaignDays||0);
    return `<div class="list-item"><b>День ${day}</b> — ${esc(t)}<small>${esc(h.Type||h.type||'')}</small></div>`;
  }).join('')||'<div class="list-item">Пусто</div>';
}

function actionsHtml(room){
  const acts=(house.actions||[]).filter(a=>!a.room || a.room===room || (room==='common'&&a.room==='overview'));
  if(!acts.length) return '<div class="notice">Нет доступных действий</div>';
  return acts.map(a=>{
    const dis=!a.available || !house.isOwnerViewer;
    const cost=a.cost?`<span class="cost">${Number(a.cost).toLocaleString('ru-RU')}</span>`:'';
    const hint=a.hint?`<span class="hint">${esc(a.hint)}</span>`:'';
    const cmd=a.command?`<span class="hint">${esc(a.command)}</span>`:'';
    return `<button class="action" ${dis?'disabled':''} onclick='onAction(${JSON.stringify(a).replace(/'/g,"&#39;")})'>${esc(a.label)} ${cost}${hint}${cmd}</button>`;
  }).join('');
}

function onAction(a){
  if(!house.isOwnerViewer){ toast('Только владелец'); return; }
  if(!a.available){ toast(a.disabledReason||'Недоступно'); return; }
  // invite needs name
  if(a.id==='invite' || a.id==='rename'){
    openPrompt(a);
    return;
  }
  openConfirm(a);
}

function openConfirm(a){
  pendingAction=a;
  document.getElementById('modalTitle').textContent=a.label;
  document.getElementById('modalBody').innerHTML=
    `Стоимость: <b>${a.cost?Number(a.cost).toLocaleString('ru-RU')+' золота':'бесплатно'}</b><br><br>`+
    (a.command?`Команда: <code>${esc(a.command)}</code><br><br>`:'')+
    `Подтвердить действие в игре?`;
  document.getElementById('modal').classList.add('show');
  document.getElementById('modalConfirm').onclick=async()=>{
    closeModal();
    await postAction(a.id);
    if(a.command) copyCmd(a.command);
  };
}

function openPrompt(a){
  pendingAction=a;
  const field=a.id==='invite'?'имя гостя (Twitch)':'новое имя дома';
  document.getElementById('modalTitle').textContent=a.label;
  document.getElementById('modalBody').innerHTML=
    `Введите ${field}:<br><br><input id="modalInput" style="width:100%;padding:8px;background:#1a1814;border:1px solid #6b5a40;color:#e8e0cf">`+
    (a.command?`<br><br>Или скопируйте: <code>${esc(a.command)}</code>`:'');
  document.getElementById('modal').classList.add('show');
  document.getElementById('modalConfirm').onclick=async()=>{
    const val=(document.getElementById('modalInput')||{}).value||'';
    closeModal();
    if(!val.trim()){ toast('Пустое значение'); return; }
    const extra=a.id==='invite'?{target:val.trim()}:{value:val.trim()};
    await postAction(a.id, extra);
    if(a.command) copyCmd(a.command.replace('<player>',val.trim()).replace('<name>',val.trim()));
  };
}

function closeModal(){ document.getElementById('modal').classList.remove('show'); pendingAction=null; }
function copyCmd(cmd){ navigator.clipboard?.writeText(cmd); toast('Скопировано: '+cmd); setFooter('Скопировано: '+cmd); }
function toast(text){ const el=document.getElementById('toast'); el.textContent=text; el.classList.add('show'); clearTimeout(window.__toast); window.__toast=setTimeout(()=>el.classList.remove('show'),2400); }
function setFooter(t){ document.getElementById('footerState').textContent=t; }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function roman(n){ return ({1:'I',2:'II',3:'III',4:'IV',5:'V'})[n]||String(n||'—'); }

function renderAll(){
  if(!house) return;
  showApp();
  renderHeader();
  renderTabs();
  renderScene();
  renderSide();
}

async function refresh(force){
  try{
    const raw=await fetchHouse();
    if(!raw) return;
    const next=normalize(raw);
    if(!force && next.revision===lastRevision && house){
      document.getElementById('liveDot').classList.remove('off');
      document.getElementById('syncLabel').textContent='Синхронизировано';
      return;
    }
    lastRevision=next.revision;
    house=next;
    document.getElementById('liveDot').classList.remove('off');
    document.getElementById('syncLabel').textContent='Синхронизировано';
    renderAll();
  }catch(e){
    document.getElementById('liveDot').classList.add('off');
    document.getElementById('syncLabel').textContent='Нет связи';
    setFooter('Ошибка: '+e.message);
  }
}

(async function boot(){
  await refresh(true);
  // Queue mode: no snapshot polling — panel is a remote control only.
  if (!isQueueMode()) {
    pollTimer=setInterval(()=>refresh(false), 2000);
  } else {
    document.getElementById('syncLabel').textContent='Очередь';
    setFooter('Кнопки → Worker → игра · без чата · без снимков');
  }
})();
</script>
</body>
