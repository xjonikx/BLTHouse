let _rightUiBound = false;
function bindRightContentUi(){
  if (_rightUiBound) return;
  const box = document.getElementById('rightContent');
  if (!box) return;
  _rightUiBound = true;
  box.addEventListener('click', (ev) => {
    const btn = ev.target && ev.target.closest ? ev.target.closest('[data-ui]') : null;
    if (!btn || btn.disabled) return;
    ev.preventDefault();
    ev.stopPropagation();
    const ui = btn.getAttribute('data-ui');
    if (ui === 'forge-type') {
      selectForgeType(btn.getAttribute('data-type') || '');
      return;
    }
    if (ui === 'forge-unique-toggle') {
      toggleForgeUnique();
      return;
    }
    if (ui === 'forge-craft') {
      craftSelectedForgeType();
      return;
    }
    if (ui === 'inspect') {
      showItemInspect(btn.getAttribute('data-src') || '', btn.getAttribute('data-idx') || '');
      return;
    }
    if (ui === 'shop-more') {
      const kind = btn.getAttribute('data-kind') === 'clothes' ? 'clothes' : 'goods';
      // Ask game for next page from in-memory shop cache (does not dump full catalog into state).
      postAction('refresh_shop', { value: 'more:' + kind });
      return;
    }
    if (ui === 'act') {
      const action = btn.getAttribute('data-action') || '';
      const target = btn.getAttribute('data-target') || '';
      const value = btn.getAttribute('data-value') || '';
      const extra = {};
      if (target) extra.target = target;
      if (value) extra.value = value;
      postAction(action, extra);
      return;
    }
    if (ui === 'house-action') {
      const id = btn.getAttribute('data-action-id') || '';
      const a = (house.actions || []).find(x => x && x.id === id);
      if (a) onAction(a);
      else toast('Действие не найдено: ' + id);
    }
  });
}

function findItemBySrc(src, idx){
  const want = String(idx || '');
  const matchIdx = (it) => String(it.Index ?? it.index ?? '') === want;
  if (src === 'storage') return (house.storageItems || []).find(matchIdx) || null;
  if (src === 'goods') return (house.storageGoods || []).find(matchIdx) || null;
  if (src === 'hero') return (house.heroInventory || []).find(matchIdx) || null;
  if (src === 'shop') {
    const i = Number(want);
    return Number.isFinite(i) ? (house.shopItems || [])[i] : null;
  }
  return null;
}
function showItemInspect(src, idx){
  const it = findItemBySrc(src, idx);
  if (!it) { toast('Предмет не найден'); return; }
  const name = it.FinalName || it.finalName || it.Name || it.name || it.ItemStringId || it.itemStringId || '—';
  const rows = [];
  const add = (k, v) => {
    if (v == null || v === '' || v === false) return;
    rows.push(`<b>${esc(k)}</b><span>${esc(String(v))}</span>`);
  };
  add('Название', name);
  add('Тип', it.ItemType || it.itemType || it.Category || it.category);
  add('Тир', (it.Tier ?? it.tier) != null ? String(it.Tier ?? it.tier) : '');
  add('Модификатор', it.ItemModifierDescription || it.itemModifierDescription);
  add('Уникальный', (it.IsUnique || it.isUnique) ? 'да' : '');
  add('ID предмета', it.ItemStringId || it.itemStringId);
  add('Цена продажи', it.EstimatedSellPrice || it.estimatedSellPrice || it.UnitPrice || it.unitPrice);
  add('На рынке', it.Available ?? it.available);
  add('Количество', it.Count || it.count);
  add('Кузнец', it.CrafterName || it.crafterName);
  add('Бонус навыка', (it.SkillBonusType || it.skillBonusType)
    ? ((it.SkillBonusType || it.skillBonusType) + ' +' + (it.SkillBonusAmount || it.skillBonusAmount || 0))
    : '');
  add('Бонус модификатора', (it.HasBonusModifier || it.hasBonusModifier)
    ? ((it.BonusModifierSkill || it.bonusModifierSkill || '') + ' +' + (it.BonusModifierAmount || it.bonusModifierAmount || 0))
    : '');
  add('Категория', it.CategoryId || it.categoryId);
  document.getElementById('modalTitle').textContent = 'Осмотр предмета';
  document.getElementById('modalBody').innerHTML =
    '<div class="inspect-grid">' + (rows.join('') || '<span>Нет данных</span>') + '</div>';
  const conf = document.getElementById('modalConfirm');
  conf.textContent = 'Закрыть';
  conf.onclick = closeModal;
  document.getElementById('modal').classList.add('show');
}

function switchTab(id){
  if (id === 'shop') id = 'shop_goods';
  if (currentTab !== id) {
    if (id === 'shop_goods') shopShown.goods = SHOP_PAGE;
    if (id === 'shop_clothes') shopShown.clothes = SHOP_PAGE;
  }
  currentTab = id;
  renderAll();
  if (isShopTab(id) && isPanelOwner() && isGameOnline() && (!(house.shopItems||[]).length)) {
    postAction('refresh_shop', { value: 'refresh' });
  }
}

function onAction(a){
  if(!isPanelOwner()){ toast('Войди Twitch как владелец'); return; }
  if(isQueueMode() && !isGameOnline()){ toast('Игра оффлайн — команды в очередь не ставятся'); refreshGameStatusUi(); return; }
  if(!a.available){ toast(a.disabledReason||'Недоступно'); return; }
  if(a.id==='inventory'){
    switchTab('storage');
    openConfirm(a);
    return;
  }
  if(a.id==='forge_craft' || a.id==='forge_unique'){
    if(a.id==='forge_unique') forgeUniqueMode = true;
    switchTab('workshop');
    toast(selectedForgeType ? ('Тип уже выбран: '+selectedForgeType+' — жми «Скрафтить»') : 'Сначала нажми тип предмета в списке (подсветится)');
    return;
  }
  if(a.id==='refresh_shop'){
    if (currentTab!=='shop_clothes') switchTab('shop_goods');
    else renderAll();
    postAction('refresh_shop', { value: 'refresh' });
    return;
  }
  if(a.id==='invite' || a.id==='rename'){
    openPrompt(a);
    return;
  }
  openConfirm(a);
}

function selectForgeType(t){
  selectedForgeType = String(t||'').trim() || null;
  renderSide();
  toast(selectedForgeType ? ('Выбрано: '+selectedForgeType) : 'Тип сброшен');
}

function toggleForgeUnique(){
  forgeUniqueMode = !forgeUniqueMode;
  renderSide();
  toast(forgeUniqueMode ? 'Режим уникального крафта' : 'Обычный крафт');
}

async function craftSelectedForgeType(){
  if(!selectedForgeType){ toast('Сначала выбери тип в списке'); return; }
  if(!isPanelOwner()){ toast('Войди Twitch как владелец'); return; }
  if(isQueueMode() && !isGameOnline()){ toast('Игра оффлайн — команды в очередь не ставятся'); refreshGameStatusUi(); return; }
  if(house.craftingEnabled===false){ toast('Crafting отключён в Settings BlacksmithingNew'); return; }
  const action = forgeUniqueMode ? 'forge_unique' : 'forge_craft';
  await postAction(action, { target: selectedForgeType, value: selectedForgeType });
}

function openConfirm(a){
  pendingAction=a;
  document.getElementById('modalTitle').textContent=a.label;
  document.getElementById('modalBody').innerHTML=
    `Стоимость: <b>${a.cost?Number(a.cost).toLocaleString('ru-RU')+' золота':'бесплатно'}</b><br><br>`+
    (a.command?`Команда: <code>${esc(a.command)}</code><br><br>`:'')+
    `Подтвердить действие в игре?`;
  document.getElementById('modal').classList.add('show');
  document.getElementById('modalConfirm').onclick=async()=>{
    closeModal();
    if(isQueueMode() && !isGameOnline()){ toast('Игра оффлайн — команды в очередь не ставятся'); refreshGameStatusUi(); return; }
    await postAction(a.id);
    if(a.command) copyCmd(a.command);
  };
}

function openPrompt(a){
  pendingAction=a;
  const field=a.id==='invite'?'имя гостя (Twitch)':'новое имя дома';
  document.getElementById('modalTitle').textContent=a.label;
  document.getElementById('modalBody').innerHTML=
    `Введите ${field}:<br><br><input id="modalInput" style="width:100%;padding:8px;background:#1a1814;border:1px solid #6b5a40;color:#e8e0cf">`+
    (a.command?`<br><br>Или скопируйте: <code>${esc(a.command)}</code>`:'');
  document.getElementById('modal').classList.add('show');
  document.getElementById('modalConfirm').onclick=async()=>{
    const val=(document.getElementById('modalInput')||{}).value||'';
    closeModal();
    if(!val.trim()){ toast('Пустое значение'); return; }
    if(isQueueMode() && !isGameOnline()){ toast('Игра оффлайн — команды в очередь не ставятся'); refreshGameStatusUi(); return; }
    const extra=a.id==='invite'?{target:val.trim()}:{value:val.trim()};
    await postAction(a.id, extra);
    if(a.command) copyCmd(a.command.replace('<player>',val.trim()).replace('<name>',val.trim()));
  };
}

function closeModal(){ document.getElementById('modal').classList.remove('show'); pendingAction=null; }
function copyCmd(cmd){ navigator.clipboard?.writeText(cmd); toast('Скопировано: '+cmd); setFooter('Скопировано: '+cmd); }
function toast(text){ const el=document.getElementById('toast'); el.textContent=text; el.classList.add('show'); clearTimeout(window.__toast); window.__toast=setTimeout(()=>el.classList.remove('show'),2400); }
function setFooter(t){ document.getElementById('footerState').textContent=t; }
function isPanelOwner(){
  return !!(house && (house.isOwnerViewer || isOwnerNow()));
}
function escAttr(s){
  return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cssEsc(s){
  try { return (window.CSS && CSS.escape) ? CSS.escape(String(s||'')) : String(s||'').replace(/[^a-zA-Z0-9_-]/g, '\\$&'); }
  catch (e) { return String(s || ''); }
}
function roman(n){ return ({1:'I',2:'II',3:'III',4:'IV',5:'V'})[n]||String(n||'—'); }

function renderAll(){
  if(!house) return;
  showApp();
  renderHeader();
  renderTabs();
  renderScene();
  applyLayoutToScene(currentTab);
  renderSide();
  renderPresenceOnly();
  updateSceneToolLocks();
}

function applyHouseIfNewer(raw, packedTs){
  const next = isQueueMode() ? applyPanelHouse(raw) : normalize(raw);
  mergeShopFromIncoming(next);
  const rev = Number(next.revision || 0) || 0;
  const ts = Number(packedTs || 0) || 0;
  if (ts > 0) noteGameTs(ts);
  if (house && !Number.isNaN(lastRevision) && rev > 0 && rev < lastRevision) return false;
  if (ts > 0 && lastStateTs > 0 && ts < lastStateTs) return false;
  if (rev > 0) lastRevision = Math.max(lastRevision, rev);
  if (ts > 0) lastStateTs = Math.max(lastStateTs, ts);
  house = next;
  return true;
}

async function refresh(force){
  const seq = ++refreshSeq;
  try{
    const {houseId, viewer} = parseRoute();
    let packedTs = 0;
    let raw = null;
    if (isQueueMode() && typeof window.BLTHouseExtFetchState === 'function' && houseId) {
      try {
        const packed = await window.BLTHouseExtFetchState(houseId, viewer);
        if (packed && packed.house) {
          raw = packed.house;
          packedTs = Number(packed.ts || 0) || 0;
          noteGameTs(packedTs);
          try { sessionStorage.setItem('blt_house_last_' + houseId, slimHouseJson(raw)); } catch(e) {}
        }
      } catch (e) {}
    }
    if (!raw) raw = await fetchHouse();
    if (!raw) return;
    if (seq !== refreshSeq) return; // newer refresh already in flight / finished
    if (!force && house && Number(raw.Revision || raw.revision || 0) === lastRevision && lastRevision >= 0) {
      refreshGameStatusUi();
      return;
    }
    if (!applyHouseIfNewer(raw, packedTs)) {
      refreshGameStatusUi();
      return;
    }
    refreshGameStatusUi();
    scheduleRenderAll();
    renderPresenceOnly();
  }catch(e){
    refreshGameStatusUi();
    setFooter('Нет свежего /state — показан последний снимок');
  }
}

function updateAuthUi(){
  const btn=document.getElementById('authBtn');
  const t=window.BLTHouseTwitch;
  if(!btn||!t) return;
  if(t.user){
    btn.textContent='⎋ '+t.user.display;
    btn.title='Выйти';
  } else {
    btn.textContent='Войти Twitch';
    btn.title='Войти через Twitch';
  }
}
function toggleTwitchAuth(){
  const t=window.BLTHouseTwitch;
  if(!t) return;
  if(t.user){
    t.logout();
    updateAuthUi();
    if (window.BLTHouseRealtime) window.BLTHouseRealtime.disconnect();
    if(house){ house=applyPanelHouse(house); renderAll(); }
  } else t.login();
}

async function startAtmosphere(){
  presenceJoinedAt = Date.now();
  seenEventIds = new Set();
  liveLog = [];
  const {houseId} = parseRoute();
  if (!houseId) return;

  let supabaseOk = false;
  if (useSupabaseAtmosphere() && twitchLoggedIn()) {
    supabaseOk = await window.BLTHouseRealtime.connect(houseId, {
      onUpdate: (msg) => {
        if (msg.kind === 'actors') {
          applyRealtimeActors(msg.actors);
          renderPresenceOnly();
        } else if (msg.kind === 'flavor') {
          ingestFlavorEvent(msg.event);
          renderPresenceOnly();
        } else if (msg.kind === 'layout') {
          ingestRemoteLayout(msg.layout);
        }
      },
    });
    refreshGameStatusUi();
    if (!supabaseOk) setFooter('Realtime не подключился — запасной канал Worker');
    else if (isOwnerNow()) setFooter('Владелец · очередь в игру');
  } else if (useSupabaseAtmosphere() && !twitchLoggedIn()) {
    setFooter('Войди Twitch для атмосферы');
    refreshGameStatusUi();
  }

  await announcePresenceHere();
  if (hasWorkerBackend() && !window.__bltLayoutLoop) layoutPollLoop();
  if (!supabaseOk && hasWorkerBackend() && !window.__bltPresenceLoop) presenceLongPollLoop();
  if (supabaseOk && hasWorkerBackend()) {
    setInterval(() => { pollPresenceOnce(); }, 15000);
  }
}

(async function boot(){
  document.addEventListener('click', (e)=>{
    const pop=document.getElementById('interactPop');
    if(pop && !pop.contains(e.target) && !e.target.closest('.object,.furniture,.room-person')) closeInteract();
  });
  setupSceneTools();
  capVisualPositions();
  purgeFatHouseCache();

  await promiseTimeout(window.BLTHouseTwitch ? window.BLTHouseTwitch.init() : Promise.resolve(), 6000, null);
  updateAuthUi();

  const route = parseRoute();
  if (route.houseId && isQueueMode()) {
    bootWithStub(route.houseId, route.viewer);
  }

  refresh(true).catch(() => {});

  if (!gameStatusTimer) gameStatusTimer = setInterval(() => refreshGameStatusUi(), 5000);

  if (!isQueueMode()) {
    pollTimer = setInterval(() => refresh(false), 2000);
    return;
  }

  refreshGameStatusUi();
  setFooter(isOwnerNow()
    ? 'Владелец · очередь в игру'
    : (twitchLoggedIn() ? 'Гость · кликай объекты' : 'Просмотр · войди Twitch'));

  const {houseId} = route;
  await promiseTimeout(startAtmosphere(), 10000, null);

  if (useSupabaseQueue() && houseId && window.BLTHouseSupabaseQueue.subscribeState) {
    promiseTimeout(
      window.BLTHouseSupabaseQueue.subscribeState(houseId, {
        onState: (packed) => {
          if (!packed || !packed.house) return;
          noteGameTs(packed.ts);
          if (!applyHouseIfNewer(packed.house, packed.ts)) {
            refreshGameStatusUi();
            return;
          }
          refreshGameStatusUi();
          scheduleRenderAll();
          renderPresenceOnly();
        },
      }),
      12000,
      false
    ).catch(() => {});
    pollTimer = setInterval(() => refresh(false), 30000);
  } else {
    pollTimer = setInterval(() => refresh(false), 3000);
  }
})();
</script>
