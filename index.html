<style>
:root{
  --bg:#0d0d0c;--panel:#171614;--panel2:#201e19;--panel3:#29251e;
  --line:#4d4638;--line2:#756247;--gold:#c5a360;--gold2:#ead5a4;
  --text:#e8e0cf;--muted:#9c9588;--green:#819d70;--red:#a96f64;--blue:#7694a4;
  --shadow:0 14px 40px #000b;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(circle at 52% 35%,#312b20 0,#171714 45%,#090909 100%);
  color:var(--text);font-family:Georgia,"Times New Roman",serif;overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
.app{height:100vh;display:grid;grid-template-rows:84px 50px 1fr 44px}
header{
  display:flex;align-items:center;justify-content:space-between;padding:13px 22px;
  background:linear-gradient(#2a2823,#151412);border-bottom:1px solid #6b5c42;box-shadow:0 4px 24px #000b;
}
.brand{display:flex;align-items:center;gap:13px}
.crest{
  width:50px;height:50px;display:grid;place-items:center;border:1px solid #7d6b4d;
  background:radial-gradient(circle,#574a33,#272217 68%,#131210);
  box-shadow:inset 0 0 0 3px #181612,0 0 18px #0008;color:var(--gold2);font-size:24px;
}
.title{font-size:23px;color:#eee0bf;text-shadow:0 2px 2px #000}
.subtitle{margin-top:4px;color:#999183;font:12px Arial,sans-serif}
.meta{display:flex;gap:9px;align-items:center;font:12px Arial,sans-serif}
.meta-pill{padding:8px 10px;border:1px solid #5b513f;background:#171612;color:#d2c7b1}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7fa26f;box-shadow:0 0 8px #7fa26f;margin-right:7px}
.live-dot.off{background:#a96f64;box-shadow:0 0 8px #a96f64}
.btn-inspect{font-size:11px;padding:4px 8px;border:1px solid #6a5a40;background:#2a261e;color:#d8c9a8;border-radius:4px;cursor:pointer}
.btn-inspect:hover{border-color:#c5a360;color:#ead5a4}
.inspect-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;margin-top:8px}
.inspect-grid b{color:#9c9588;font-weight:500}
.inspect-grid span{color:#e8e0cf}
.tabs{display:flex;background:linear-gradient(#27231d,#171613);border-bottom:1px solid #433d31;overflow:auto}
.tab{
  min-width:122px;border:0;border-right:1px solid #413a2f;padding:0 17px;background:transparent;color:#9e9688;position:relative;
}
.tab:hover{background:#2a261f;color:#ded2b9}
.tab.active{background:#2d281f;color:var(--gold2)}
.tab.active:after{content:"";position:absolute;left:13px;right:13px;bottom:0;height:2px;background:var(--gold);box-shadow:0 0 10px #c5a36055}
.tab.locked{opacity:.55}
.body{min-height:0;display:grid;grid-template-columns:minmax(560px,1fr) 360px}
.viewer{min-width:0;min-height:0;padding:16px}
.room-view{
  position:relative;height:100%;overflow:hidden;border:1px solid #665943;
  background:radial-gradient(circle at 50% 42%,#655b4a 0,#403c31 29%,#292820 63%,#161713 100%);
  box-shadow:inset 0 0 0 2px #0f100e,var(--shadow);
}
.room-view:before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.11) 0 1px,transparent 1px 5px),
             repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 1px,transparent 1px 6px);
}
.room-head{position:absolute;z-index:20;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.badge{padding:7px 9px;background:#141410e8;border:1px solid #63563f;color:#d1c5ad;font:11px Arial,sans-serif;box-shadow:0 2px 8px #0008}
.canvas{position:absolute;inset:52px 18px 18px}
.scene{position:absolute;inset:0;display:none}
.scene.active{display:block}
.wall{position:absolute;inset:2% 2%;border:2px solid #7b6a4e;background:linear-gradient(135deg,rgba(77,71,58,.9),rgba(32,32,28,.96));box-shadow:inset 0 0 0 1px #151511,0 10px 25px #0007}
.floor{position:absolute;left:1.5%;right:1.5%;top:18%;bottom:1.5%;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px),repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 1px,transparent 1px 22px),linear-gradient(#4c4639,#34322a);border-top:1px solid #1b1915}
.window{position:absolute;right:7%;top:5%;width:19%;height:15%;border:3px solid #514936;background:linear-gradient(#2c4049,#172228)}
.window:before,.window:after{content:"";position:absolute;background:#6e6148}
.window:before{width:2px;top:0;bottom:0;left:50%}
.window:after{height:2px;left:0;right:0;top:50%}
.object{position:absolute;z-index:8;padding:7px 8px;min-width:78px;border:1px solid #6c5c44;background:#151511de;box-shadow:0 3px 9px #0009;color:#d8cbb1;text-align:center;font:10px Arial,sans-serif;cursor:pointer}
.object:hover{border-color:#d0ad6a;color:#f0dfbb}
.object small{display:block;margin-top:3px;color:#938b7d}
.character{position:absolute;z-index:12;width:84px;text-align:center;cursor:pointer;transition:.15s}
.character:hover{transform:translateY(-2px)}
.char-sprite{width:60px;height:78px;margin:auto;position:relative;filter:drop-shadow(0 5px 4px #000a)}
.char-head{position:absolute;left:18px;top:0;width:24px;height:24px;border-radius:50%;
  background:linear-gradient(#d3aa8c,#99705b);border:1px solid #4d382e}
.char-body{position:absolute;left:10px;top:21px;width:40px;height:44px;border-radius:9px 9px 6px 6px;
  background:linear-gradient(135deg,#6e685b,#30312f);border:1px solid #49443a}
.char-leg{position:absolute;left:15px;top:61px;width:10px;height:16px;background:#20211f;border:1px solid #393631}
.char-leg.r{left:33px}
.character.female .char-body{background:linear-gradient(135deg,#6a6472,#303035)}
.character.guest .char-body{background:linear-gradient(135deg,#62565b,#303133)}
.character.selected .char-label{border-color:#d4b26a;color:#f0ddb1;box-shadow:0 0 11px #c3a05d33}
.object{
  position:absolute;z-index:8;padding:6px 8px 8px;min-width:86px;
  border:1px solid #6c5c44;background:#151511de;box-shadow:0 3px 9px #0009;color:#d8cbb1;text-align:center;
  font:10px Arial,sans-serif;cursor:pointer
}
.object:hover{border-color:#d0ad6a;color:#f0dfbb}
.object .ico{width:36px;height:36px;margin:0 auto 4px;display:block;image-rendering:auto}
.object small{display:block;margin-top:3px;color:#938b7d}
.list-item .ico{width:28px;height:28px;vertical-align:middle;margin-right:8px;border:1px solid #524839;background:#1a1814}
.locked-overlay{position:absolute;inset:0;display:grid;place-items:center;background:#0b0b0bcc;z-index:30;color:#d2c4a4}
.locked-overlay .lock-mark{
  width:54px;height:54px;border:2px solid #7a6a4a;border-radius:8px;background:#1a1814;
  display:grid;place-items:center;font:13px Arial,sans-serif;letter-spacing:1px;color:#c5a360
}
.locked-overlay span{font:14px Arial,sans-serif;margin-top:10px;color:#b5aa95;max-width:70%;text-align:center}
.tab.locked{opacity:.55}
.char-label{display:inline-block;margin-top:1px;padding:3px 6px;border:1px solid #615741;background:#171611e8;color:#e3d6bc;font:10px Arial,sans-serif}
.char-state{margin-top:3px;color:#a79f91;font:9px Arial,sans-serif}
.side{min-height:0;overflow:auto;border-left:1px solid #3c382f;background:linear-gradient(#1a1916,#121310)}
.side-section{padding:13px 14px;border-bottom:1px solid #38342c}
.kicker{font:10px Arial,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:#91897b;margin-bottom:9px}
.room-title{font-size:19px;color:#e4d5b2}
.desc{font:11px Arial,sans-serif;color:#989183;line-height:1.45;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}
.stat{border:1px solid #474138;background:#211f1a;padding:8px}
.stat span{display:block;font:10px Arial,sans-serif;color:#8c8579}.stat b{display:block;margin-top:4px;font-size:14px;font-weight:normal;color:#dfcfad}
.btns{display:grid;gap:7px}
.action{width:100%;padding:9px 10px;text-align:left;border:1px solid #524a39;background:linear-gradient(#342f24,#24221d);color:#d7c9ac}
.action:hover{border-color:#a98a57;background:linear-gradient(#463d2d,#29261f);color:#f0ddb5}
.action:disabled{opacity:.45;cursor:not-allowed}
.action.selected{border-color:#d4a84a;background:linear-gradient(#5a4a2e,#3a3224);color:#ffe9b8;box-shadow:inset 0 0 0 1px #c9a45a}
.forge-types{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.forge-types .action{text-align:center;padding:8px 6px;font-size:12px}
.cost{float:right;color:#d0ac69;font-size:11px}
.hint{display:block;color:#8f887c;font:9px Arial,sans-serif;margin-top:3px}
.notice{border-left:3px solid #a88651;background:#211e17;padding:9px 10px;font:11px Arial,sans-serif;line-height:1.45;color:#c4b9a5}
.notice.ok{border-left-color:#7b9a6a}.notice.warn{border-left-color:#ad6b60}
.list{display:grid;gap:6px}
.list-item{border:1px solid #454037;background:#211f1a;padding:8px;font:11px Arial,sans-serif;color:#c1b7a4;display:flex;align-items:flex-start;gap:8px}
.list-item .txt{flex:1;min-width:0}
.list-item b{color:#e0d0ae}.list-item small{display:block;color:#90897d;margin-top:3px}
.progress{height:7px;background:#10110f;border:1px solid #443e32;margin-top:8px}.progress i{display:block;height:100%;background:#ad8950}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:100}
.modal.show{display:flex}
.modal-box{width:min(520px,90vw);background:linear-gradient(#2c2820,#171613);border:1px solid #796547;box-shadow:0 25px 75px #000d;padding:18px}
.modal-title{font-size:19px;color:#ead7ad}.modal-body{margin-top:9px;font:12px Arial,sans-serif;color:#bbb1a0;line-height:1.5}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.modal-actions button{padding:9px 13px;border:1px solid #6b5a40;background:#25211a}
.toast{position:fixed;right:18px;bottom:60px;padding:10px 13px;background:#201e18;border:1px solid #6b5b40;color:#e5d8bd;font:11px Arial,sans-serif;opacity:0;transform:translateY(10px);transition:.2s;z-index:120}
.toast.show{opacity:1;transform:translateY(0)}
.footer{display:flex;justify-content:space-between;align-items:center;padding:0 15px;background:#12110f;border-top:1px solid #3d382e;color:#817a70;font:11px Arial,sans-serif}
.error-screen{display:grid;place-items:center;height:100vh;padding:24px;text-align:center}
@media(max-width:950px){.body{grid-template-columns:1fr 320px}}
@media(max-width:760px){body{overflow:auto}.app{height:auto;min-height:100vh}.body{display:block}.viewer{height:720px}.side{border-left:0;border-top:1px solid #3c382f}}

:root{
  --bg:#090b0a;--panel:#141715;--panel2:#1c201c;--panel3:#242921;
  --line:#4b5147;--line2:#776c50;--gold:#c8a45d;--gold2:#f0dcae;
  --text:#eee8d9;--muted:#98998f;--green:#86a873;--red:#b56e62;--blue:#7896a7;
  --shadow:0 18px 55px #000c;
}
body{
  background:radial-gradient(circle at 50% 20%,#3b392f 0,#171a17 42%,#080a09 100%);
}
.app{grid-template-rows:76px 48px 1fr 38px}
header{
  padding:10px 20px;
  background:linear-gradient(180deg,#30332d,#171a17 72%,#111310);
  border-bottom:1px solid #74684c;
}
.crest{
  width:46px;height:46px;border-radius:4px;
  background:linear-gradient(145deg,#62563c,#25281f);

}
.meta-pill{border-radius:3px;background:#111410;border-color:#5b5e50;padding:7px 10px}
.btn-auth{

  background:linear-gradient(#403b2c,#25271f);color:#f0dcae;font:12px Arial,sans-serif;
}
.btn-auth:hover{border-color:#c8a45d}
.tabs{padding-left:10px;background:linear-gradient(#20241f,#111410)}
.tab.active{background:linear-gradient(#34372f,#252921)}
.room-view{
  border-radius:4px;border-color:#75684c;
  background:radial-gradient(ellipse at 50% 43%,rgba(121,112,91,.7) 0,rgba(65,66,56,.88) 42%,rgba(28,31,28,.98) 100%);
}
.room-view:after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:50;

  border-radius:3px;

}
.object{
  min-width:84px;border-radius:3px;

  transition:transform .12s,border-color .12s,box-shadow .12s;
}
.object:hover{transform:translateY(-2px);box-shadow:0 7px 18px #000b}
.object .ico{width:36px;height:36px;object-fit:contain;background:#171612;border:1px solid #524839}
.side{background:linear-gradient(180deg,#1a1d19,#10130f);border-left-color:#484b42}
.stat{border-color:#454a40;background:linear-gradient(#252922,#1c201b);border-radius:3px}
.action{border-radius:3px;background:linear-gradient(#30342d,#20241f)}
.list-item{border-radius:3px;background:#20241f;border-color:#41463d}
.list-item .ico{object-fit:contain}
.footer{background:#0c0f0c}
.notice.auth{border-left-color:#7694a4}
.interact-pop{
  position:fixed;z-index:90;min-width:240px;max-width:300px;
  padding:10px;border:1px solid #6c5c44;background:#141410f2;
  box-shadow:0 12px 28px #000c;display:none;
}
.interact-pop.show{display:block}
.interact-pop .ip-title{color:#eee0bf;font-size:14px}
.interact-pop .ip-sub{margin:4px 0 8px;color:#9c9588;font:11px Arial,sans-serif}
.interact-pop .ip-btns{display:flex;flex-direction:column;gap:6px}
.interact-pop .ip-btns button{
  text-align:left;padding:7px 9px;border:1px solid #5b513f;background:#1c1a16;color:#d8cbb1;font:12px Arial,sans-serif;
}
.interact-pop .ip-btns button:hover{border-color:#d0ad6a;color:#f0dfbb}
.interact-pop .ip-btns button.game{border-color:#6b5c42;color:#ead5a4}
.interact-pop .ip-cd{margin-top:6px;color:#c5a360;font:11px Arial,sans-serif}
.interact-pop .ip-btns button:disabled{opacity:.45;cursor:not-allowed}
.presence-bar{
  position:absolute;z-index:18;left:14px;right:14px;bottom:10px;
  display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;
}
.presence-chip{
  padding:4px 8px;background:#141410e8;border:1px solid #63563f;color:#d1c5ad;
  font:11px Arial,sans-serif;box-shadow:0 2px 8px #0008;
}
.presence-log{margin-top:8px;font:11px Arial,sans-serif;color:#9c9588;line-height:1.4;max-height:72px;overflow:auto}
.btn-sell{margin-left:auto;font:11px Arial,sans-serif;padding:4px 8px;border:1px solid #5b513f;background:#1c1a16;color:#ead5a4}
.presence-bar{top:48px;bottom:auto;z-index:25}
.row-acts{display:flex;flex-direction:column;gap:4px;margin-left:auto}

  pointer-events:none;
}

  pointer-events:auto;
  border:1px solid #615944;border-radius:3px;

  border-color:#d6b46d;background:#27261de8;

  margin-top:10px;padding:10px;border:1px solid #6e6248;

/* ===== MOBILE-GAME-LIKE ROOM ===== */
.room-view{background:#11120f!important;overflow:hidden!important}
.canvas{inset:44px 10px 42px!important;perspective:1100px;overflow:hidden!important}
.scene.active{display:block!important;overflow:hidden}
.scene .wall,.scene .floor,.scene .window{display:none!important}
.mobile-room{
  position:absolute;inset:0;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 25%,#5d5849 0,#3c3b32 33%,#20231f 65%,#10120f 100%);
}
.mobile-room.yard-outdoor{
  background:linear-gradient(180deg,#5b8fb5 0%,#8eb8d0 22%,#c5d6b0 38%,#7a9a48 40%,#4a6b2e 72%,#2f451c 100%);
}
.mobile-room.yard-outdoor:before,
.mobile-room.yard-outdoor .mobile-backwall,
.mobile-room.yard-outdoor .mobile-beam,
.mobile-room.yard-outdoor .mobile-rug{display:none!important}
.mobile-room.yard-outdoor .mobile-floor{
  position:absolute;left:-8%;right:-8%;top:40%;bottom:-12%;
  background:
    radial-gradient(ellipse at 30% 40%,#6f9440aa 0%,transparent 45%),
    radial-gradient(ellipse at 70% 60%,#557a32aa 0%,transparent 40%),
    linear-gradient(180deg,#6b8f3e,#456828 55%,#2f451c);
  transform:none;transform-origin:50% 0%;
  border-top:2px solid #8fa85a;box-shadow:none;
}
.yard-flower{
  position:absolute;z-index:8;width:26px;height:26px;object-fit:contain;
  pointer-events:none;filter:drop-shadow(0 2px 3px #0007);
  image-rendering:auto;
}
.mobile-room:before{
  content:"";position:absolute;left:4%;right:4%;top:5%;height:39%;
  background:
    linear-gradient(135deg,#5a5648,#3b3b32 60%,#292b25);
  border:2px solid #806f4d;
  box-shadow:inset 0 0 0 1px #171814,0 14px 35px #000b;

<nav class="tabs" id="tabs"></nav>
<div class="body">

        <button class="scene-tool" id="resetPositionsBtn" type="button">↺ Сбросить</button>

<script>
const TAB_DEFS = [
  {id:'common', type:'common', label:'Общая'},
  {id:'family', type:'family', label:'Семья'},
  {id:'workshop', type:'workshop', label:'Мастерская'},
  {id:'yard', type:'yard', label:'Двор'},
  {id:'shop_goods', type:'shop_goods', label:'Магазин Goods'},
  {id:'shop_clothes', type:'shop_clothes', label:'Магазин одежды'},
  {id:'storage', type:'storage', label:'Хранилище'},
  {id:'history', type:'history', label:'История'},
];

let house = null;
let currentTab = 'common';
let selectedForgeType = null;
let forgeUniqueMode = false;
let pendingAction = null;
let pollTimer = null;
let lastRevision = -1;
let presence = { actors: {}, events: [] };
let presenceTimer = null;
let presenceJoinedAt = 0;
let seenEventIds = new Set();
let liveLog = [];
/** Pause after every atmosphere click (bed / floor / flavor). */
const FLAVOR_CD_MS = 3000;
const WALK_CD_MS = 3000;
let flavorCdUntil = 0;
let walkCdUntil = 0;
let flavorCdTimer = null;
let lastGameTs = 0;
/** Game heartbeat ~30s; reject queue if state ts older than this. */
const GAME_OFFLINE_MS = 40000;
let gameStatusTimer = null;
let sceneMode = 'inspect';
let dragState = null;
let selectedSceneEntity = null;
let visualPositions = {};
let remoteLayout = { ts: 0, rev: 0, rooms: {} };
let layoutSince = 0;
let applyingRemoteLayout = false;
let layoutPublishTimer = null;
let layoutReadyFromServer = false;
let lastStateTs = 0;
let refreshSeq = 0;
let _renderPending = false;

function purgeFatHouseCache(){
  try {
    for (let i = sessionStorage.length - 1; i >= 0; i--) {
      const k = sessionStorage.key(i);
      if (!k || k.indexOf('blt_house_last_') !== 0) continue;
      const v = sessionStorage.getItem(k);
      if (!v || v.length > 80000) sessionStorage.removeItem(k);
    }
  } catch (e) {}
}

function capVisualPositions(){
  try {
    const keys = Object.keys(visualPositions || {});
    if (keys.length > 400) {
      const trimmed = {};
      keys.slice(-200).forEach(k => { trimmed[k] = visualPositions[k]; });
      visualPositions = trimmed;
      saveVisualPositions();
    }
  } catch (e) {}
}

function hasWorkerBackend(){
  const c = window.BLT_HOUSE_EXT || {};
  return !!(String(c.ebsUrl || c.queueUrl || '').trim());
}

function promiseTimeout(p, ms, fallback){
  return Promise.race([
    p,
    new Promise(resolve => setTimeout(() => resolve(fallback), ms)),
  ]);
}

function bootWithStub(houseId, viewer){
  house = applyPanelHouse(queueStub(houseId, viewer));
  showApp();
  renderAll();
  refreshGameStatusUi();
  setFooter('Загрузка состояния…');
}

function scheduleRenderAll(){
  if (_renderPending) return;
  _renderPending = true;
  requestAnimationFrame(() => {
    _renderPending = false;
    renderAll();
  });
}
try { visualPositions = JSON.parse(localStorage.getItem('blt_house_visual_positions') || '{}') || {}; } catch (e) { visualPositions = {}; }
let lastInteractPos = null;

function parseRoute(){
  const path = location.pathname || '';
  const hash = (location.hash || '').replace(/^#/, '');
  const qs = new URLSearchParams(location.search);
  const hashQ = hash.indexOf('?') >= 0 ? hash.slice(hash.indexOf('?') + 1) : '';
  const hqs = new URLSearchParams(hashQ);
  const pathPart = hash.split('?')[0] || path;
  const m = pathPart.match(/\/house\/([^\/\?#]+)/i) || path.match(/\/house\/([^\/\?#]+)/i);
  return {
    houseId: m ? decodeURIComponent(m[1]) : (qs.get('house') || hqs.get('house') || ''),
    viewer: qs.get('viewer') || hqs.get('viewer') || '',
  };
}

function isOwnerNow(){
  const t = window.BLTHouseTwitch;
  return !!(t && t.isOwner && house && t.isOwner(house));
}
function twitchLoggedIn(){
  const t = window.BLTHouseTwitch;
  return !!(t && t.user && t.token);
}
function setSync(ok, label){
  const dot = document.getElementById('liveDot');
  const lab = document.getElementById('syncLabel');
  if (!dot || !lab) return;
  if (ok) dot.classList.remove('off'); else dot.classList.add('off');
  lab.textContent = label;
}
function normalizeGameTs(ts){
  let n = Number(ts || 0) || 0;
  if (n > 0 && n < 1e12) n *= 1000;
  return n;
}
function gameTsAgeMs(ts){
  const n = normalizeGameTs(ts);
  if (!n) return Infinity;
  return Date.now() - n;
}
function isTsFresh(ts){
  const age = gameTsAgeMs(ts);
  return age >= 0 && age < GAME_OFFLINE_MS;
}
function noteGameTs(ts){
  const n = normalizeGameTs(ts);
  if (n > lastGameTs) lastGameTs = n;
}
function isGameOnline(){
  if (!lastGameTs) return false;
  return isTsFresh(lastGameTs);
}
function actionNeedsGame(action){
  return !!String(action || '').trim();
}
async function verifyGameOnlineFresh(){
  const {houseId, viewer} = parseRoute();
  if (!houseId || typeof window.BLTHouseExtFetchState !== 'function') return isGameOnline();
  try {
    const packed = await window.BLTHouseExtFetchState(houseId, viewer);
    if (!packed || !packed.ts) return false;
    noteGameTs(packed.ts);
    return isTsFresh(packed.ts);
  } catch (e) {
    return false;
  }
}
function canRunGameActions(){
  if (!isPanelOwner()) return false;
  if (isQueueMode() && !isGameOnline()) return false;
  return true;
}
window.BLTHouseAssertGameOnlineForAction = function(action){
  if (!isQueueMode() && !hasWorkerBackend()) return null;
  if (!actionNeedsGame(action)) return null;
  if (!isGameOnline()) {
    const err = new Error('game_offline');
    err.code = 'game_offline';
    return err;
  }
  return null;
};
function refreshGameStatusUi(forceLabel){
  const online = isGameOnline();
  if (forceLabel) {
    setSync(online, forceLabel);
    return;
  }
  let base = defaultSyncLabel();
  const game = online ? 'игра онлайн' : 'игра оффлайн';
  setSync(online, base + ' · ' + game);
}
function defaultSyncLabel(){
  if (isOwnerNow()) return 'Владелец';
  if (twitchLoggedIn()) return 'Гость';
  return 'Просмотр';
}
function humanQueueError(e){
  const code = e && e.code;
  if (code === 'login_required')
    return 'Войди через Twitch (кнопка в шапке), затем повтори действие.';
  if (code === 'not_owner')
    return 'Игровые действия только у владельца дома. Атмосфера доступна после входа.';
  if (code === 'rate limit') return 'Слишком часто — подожди секунду.';
  if (code === 'game_offline') return 'Игра оффлайн — команды в очередь не ставятся';
  return String((e && e.message) || e || 'сбой');
}

function apiBase(){
  const c = window.BLT_HOUSE_EXT || {};
  if (c.localGameApi) return String(c.localGameApi).replace(/\/$/,'');
  return '';
}

function useSupabaseQueue(){
  return !!(window.BLTHouseSupabaseQueue && window.BLTHouseSupabaseQueue.enabled && window.BLTHouseSupabaseQueue.enabled());
}

function isQueueMode(){
  const c = window.BLT_HOUSE_EXT || {};
  return !apiBase() && !!(c.supabaseUrl && c.supabaseAnonKey);
}

function queueStub(houseId, viewer){
  const actions = [
    {Id:'upgrade_house', Label:'Улучшить дом', Room:'common', Available:true},
    {Id:'unlock_workshop', Label:'Построить мастерскую', Room:'workshop', Available:true},
    {Id:'upgrade_forge', Label:'Улучшить кузницу', Room:'workshop', Available:true},
    {Id:'unlock_yard', Label:'Открыть двор', Room:'yard', Available:true},
    {Id:'upgrade_stable', Label:'Улучшить конюшню', Room:'yard', Available:true},
    {Id:'expand_storage', Label:'Расширить склад', Room:'storage', Available:true},
    {Id:'unlock_guest_room', Label:'Гостевая комната', Room:'family', Available:true},
    {Id:'expand_family', Label:'Места для семьи', Room:'family', Available:true},
    {Id:'inventory', Label:'Склад + инвентарь BLT', Room:'storage', Available:true},
    {Id:'sell_all', Label:'Продать весь склад BLT', Room:'storage', Available:true},
    {Id:'forge_craft', Label:'Ковать', Room:'workshop', Available:true},
    {Id:'forge_unique', Label:'Ковать уникальный', Room:'workshop', Available:true},
    {Id:'refresh_shop', Label:'Обновить магазин', Room:'shop', Available:true},
  ];
  return {
    HouseId: houseId,
    DisplayName: 'Дом ' + (viewer || houseId),
    OwnerPlayerId: viewer || '',
    OwnerName: viewer || '—',
    LocationName: 'в игре',
    LocationType: '—',
    HouseLevel: 1,
    HouseLevelRoman: 'I',
    StatusText: 'команды уходят в игру через очередь',
    IsOwnerViewer: false,
    Gold: 0,
    Rooms: [
      {Type:'common', Unlocked:true, Level:1, Description:'Общая'},
      {Type:'family', Unlocked:true, Level:1, Description:'Семья'},
      {Type:'workshop', Unlocked:true, Level:1, Description:'Мастерская'},
      {Type:'yard', Unlocked:true, Level:1, Description:'Двор'},
      {Type:'storage', Unlocked:true, Level:1, Description:'Склад'},
    ],
    Residents: [], Guests: [], Pets: [], Mounts: [], Furniture: [],
    StorageItems: [], StorageGoods: [], HeroInventory: [], ShopItems: [], ForgeItemTypes: [], History: [],
    CraftingSkill: 0, CraftingMaxTier: 0, CraftingDefaultCost: 0, CraftingEnabled: true,
    Actions: actions,
    Revision: 0,
  };
}

function restoreHouseSearchIfMissing(){
  const {houseId} = parseRoute();
  if (houseId) return false;
  let search = '';
  try { search = sessionStorage.getItem('blt_house_return') || ''; } catch (e) {}
  if (!search || search.indexOf('house=') < 0) return false;
  let path = location.pathname.replace(/404\.html$/i, '');
  if (!path) path = '/';
  if (!/index\.html$/i.test(path) && !path.endsWith('/')) path += '/';
  history.replaceState({}, '', path + (search.charAt(0)==='?' ? search : '?' + search));
  return true;
}

async function fetchHouse(){
  if (typeof window.BLTHouseTwitch?.rememberReturn === 'function') window.BLTHouseTwitch.rememberReturn();
  restoreHouseSearchIfMissing();
  const {houseId, viewer} = parseRoute();
  if(!houseId){
    showApp();
    let links = '';
    if (typeof window.BLTHouseExtListHouses === 'function') {
      try {
        const list = await window.BLTHouseExtListHouses();
        if (list && list.length) {
          links = '<div style="margin-top:14px;text-align:left;max-width:420px;margin-left:auto;margin-right:auto">' +
            list.slice(0, 12).map(h => {
              const href = '?house=' + encodeURIComponent(h.houseId) + (h.owner ? '&viewer=' + encodeURIComponent(h.owner) : '');
              return '<div style="margin:6px 0"><a href="'+href+'" style="color:#ead5a4">'+(h.name||h.houseId)+'</a> <small style="color:#9c9588">'+esc(h.owner||'')+'</small></div>';
            }).join('') + '</div>';
        }
      } catch (e) {}
    }
    document.getElementById('bootError').style.display='grid';
    document.getElementById('app').style.display='none';
    document.getElementById('bootTitle').textContent='Укажите дом';
    document.getElementById('bootMsg').innerHTML=
      'Ссылка: …/index.html?house=HOUSE_ID · или !house panel в чате. После входа в Twitch дом больше не подменяется первым из списка.' + links;
    return null;
  }
  if (typeof window.BLTHouseTwitch?.rememberReturn === 'function') window.BLTHouseTwitch.rememberReturn();

  if(isQueueMode()){
    showApp();
    const cacheKey = 'blt_house_last_' + houseId;
    if (typeof window.BLTHouseExtFetchState === 'function') {
      try {
        const packed = await window.BLTHouseExtFetchState(houseId, viewer);
        const remote = packed && packed.house ? packed.house : null;
        if (remote) {
          try { sessionStorage.setItem(cacheKey, slimHouseJson(remote)); } catch(e) {}
          return remote;
        }
      } catch (e) { console.warn('state', e); }
    }
    try {
      const cached = sessionStorage.getItem(cacheKey);
      if (cached) {
        if (cached.length > 250000) { sessionStorage.removeItem(cacheKey); }
        else return JSON.parse(cached);
      }
    } catch (e) { try { sessionStorage.removeItem(cacheKey); } catch(_){} }
    return queueStub(houseId, viewer);
  }

  if(!apiBase()){
    showBoot('Нет связи', 'Укажи supabaseUrl+supabaseAnonKey в config.js (или localGameApi).');
    return null;
  }

  const url = `${apiBase()}/api/house/${encodeURIComponent(houseId)}?viewer=${encodeURIComponent(viewer||'')}`;
  const r = await fetch(url, {cache:'no-store'});
  if(r.status === 503){
    showBoot('Кампания не загружена', 'Запустите Bannerlord с модулем BLTHouseExtensionTest.');
    return null;
  }
  if(r.status === 404){
    showBoot('Дом не найден', 'Купите дом: !house buy');
    return null;
  }
  if(!r.ok){
    const t = await r.text();
    showBoot('Ошибка API', t || r.statusText);
    return null;
  }
  return await r.json();
}

function mergeShopFromIncoming(next){
  if (!next) return;
  const incoming = next.shopItems || [];
  const append = !!(next.shopAppend);
  const prev = (house && house.shopItems) ? house.shopItems : [];
  if (incoming.length) {
    if (append && prev.length) {
      const seen = new Set(prev.map(it => String(it.ItemStringId||it.itemStringId||'').toLowerCase()));
      const merged = prev.slice();
      incoming.forEach(it => {
        const id = String(it.ItemStringId||it.itemStringId||'').toLowerCase();
        if (id && seen.has(id)) return;
        if (id) seen.add(id);
        merged.push(it);
      });
      next.shopItems = merged;
    }
    // else keep next.shopItems as replacement (refresh page 1)
  } else if (prev.length) {
    next.shopItems = prev;
    if (!next.shopStatus && house.shopStatus) next.shopStatus = house.shopStatus;
    if (!next.shopSettlementName && house.shopSettlementName) next.shopSettlementName = house.shopSettlementName;
  }
}

}

async function postAction(action, extra={}){
  if (typeof window.BLTHouseExtPublishAction === 'function' && isQueueMode()) {
    try {
      const {houseId} = parseRoute();
      if (!isOwnerNow()) {
        toast('Игровые кнопки — только владельцу. Войди Twitch тем же ником, что в BLT.');
        setFooter('Онлайн');
        refreshGameStatusUi();
        return {ok:false, msg:'not_owner'};
      }
      if (actionNeedsGame(action) && !(await verifyGameOnlineFresh())) {
        toast('Игра оффлайн — команды в очередь не ставятся');
        setFooter('Игра оффлайн');
        refreshGameStatusUi();
        return {ok:false, msg:'game_offline'};
      }
      const prevTs = lastGameTs || null;
      const pub = await window.BLTHouseExtPublishAction(action, extra);
      const actionId = (pub && (pub.actionId || (pub.data && pub.data.queued))) || (extra && (extra.id || extra.actionId)) || '';
      toast('В очередь игры');
      setFooter('Игра ← ' + action);
      setSync(true, 'В очереди');
      if (typeof window.BLTHouseExtWaitState === 'function') {
        window.BLTHouseExtWaitState(houseId, { prevTs, actionId, timeoutMs: 8000, viewer: parseRoute().viewer }).then(remote => {
          if (!remote) { refreshGameStatusUi(); toast('Игра не ответила — проверь, что мод запущен'); return; }
          applyHouseIfNewer(remote, null);
          try { sessionStorage.setItem('blt_house_last_' + houseId, slimHouseJson(remote)); } catch(e) {}
          scheduleRenderAll();
          const msg = remote.statusText || remote.StatusText || '';
          if (msg && msg !== 'функционирует нормально') toast(msg);
          refreshGameStatusUi();
          setFooter(msg || 'Состояние из игры');
        }).catch(()=> refreshGameStatusUi());
      }
      return {ok:true, msg:'queue', via: pub.via, house:null, actionId};
    } catch (e) {
      const msg = humanQueueError(e);
      toast(msg);
      setFooter(msg);
      if (e && e.code === 'not_owner') {
        refreshGameStatusUi();
      } else if (e && e.code === 'login_required') {
        refreshGameStatusUi();
      } else if (e && e.code === 'game_offline') {
        refreshGameStatusUi();
      } else {
        setSync(false, 'Сбой очереди');
      }
      return {ok:false, msg};
    }
  }

  if (typeof window.BLTHouseExtPublishAction === 'function' && ((window.BLT_HOUSE_EXT||{}).ebsUrl || (window.BLT_HOUSE_EXT||{}).queueUrl)) {
    if (actionNeedsGame(action) && !(await verifyGameOnlineFresh())) {
      toast('Игра оффлайн — команды в очередь не ставятся');
      setFooter('Игра оффлайн');
      refreshGameStatusUi();
      return {ok:false, msg:'game_offline'};
    }
    try {
      const pub = await window.BLTHouseExtPublishAction(action, extra);
      toast('В очередь');
      setFooter('Queue: '+action);
      if (apiBase()) await refresh(true);
      return {ok:true, msg:'queue', house:null};
    } catch (e) {
      console.warn('queue publish failed, fallback http', e);
      if (!apiBase()) {
        toast(String(e.message||e));
        setFooter(String(e.message||e));
        return {ok:false, msg:String(e.message||e)};
      }
    }
  }

  const {houseId, viewer} = parseRoute();
  const body = Object.assign({action, viewer}, extra);
  const r = await fetch(`${apiBase()}/api/house/${encodeURIComponent(houseId)}/action`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body),
  });
  const data = await r.json().catch(()=>({Ok:false,Message:'Bad response'}));
  const ok = data.Ok ?? data.ok;
  const msg = data.Message ?? data.message ?? '';
  const h = data.House ?? data.house;
  if(ok && h){ house = normalize(h); renderAll(); }
  else if(ok){ await refresh(true); }
  toast(msg || (ok ? 'Готово' : 'Ошибка'));
  setFooter(msg);
  return {ok, msg, house:h};
}

function isFurnitureLayoutKey(key){

function furnitureOnlyMap(positions){

    if (p && typeof p.x === 'number' && typeof p.y === 'number') out[key] = { x: p.x, y: p.y };

function stripPersonKeysFromRooms(rooms){

/**
 * Atmosphere live updates go through Supabase WebSocket when available.
 * Worker presence is only a backup for "who is online" (idle), not for walk/layout echo.
 */
async function publishPresenceDual(payload){
  const eventId = payload && payload.eventId ? payload.eventId : ((payload && payload.idle) ? null : newEventId());
  const body = Object.assign({}, payload || {});
  if (eventId) body.eventId = eventId;
  let workerData = null;

  if (useSupabaseAtmosphere() && window.BLTHouseRealtime) {
    try { await window.BLTHouseRealtime.publishFlavor(body); } catch (e) {}
    // Idle heartbeat to Worker keeps "кто здесь" if someone has no Supabase; never use Worker reply to move avatars.
    if (body.idle === true && typeof window.BLTHouseExtPublishPresence === 'function') {
      try { workerData = await window.BLTHouseExtPublishPresence(body); } catch (e) {}
    }
    return workerData;
  }

  if (typeof window.BLTHouseExtPublishPresence === 'function') {
    try { workerData = await window.BLTHouseExtPublishPresence(body); } catch (e) {}
  }
  return workerData;
}

function mergeLayoutRooms(rooms){
  if (!rooms || typeof rooms !== 'object') return;
  const clean = stripPersonKeysFromRooms(rooms);
  Object.keys(clean).forEach((room) => {
    const pos = clean[room];
    Object.keys(pos).forEach((key) => {

function findLayoutEl(scene, key){
  if (!scene || !key) return null;
  const byKey = scene.querySelector('[data-layout-key="'+cssEsc(key)+'"]');
  if (byKey) return byKey;
  const idx = key.indexOf(':');
  if (idx < 0) return null;
  const kind = key.slice(0, idx);
  const id = key.slice(idx + 1);
  if (kind === 'person') {
    return scene.querySelector('[data-person-id="'+cssEsc(id)+'"]')
      || scene.querySelector('[data-presence-login="'+cssEsc(String(id).replace(/^presence:/,''))+'"]');
  }
  if (kind === 'object') {
    let found = null;
    scene.querySelectorAll('.object, .furniture').forEach((o) => {
      if (found) return;
      if (String(o.dataset.objectId || '') === id) { found = o; return; }
      if (String(o.dataset.layoutKey || '') === key) { found = o; return; }
      const lab = o.querySelector('.room-object-label');
      const div = o.querySelector('div');
      const txt = String((lab && lab.textContent) || (div && div.textContent) || '');
      if (txt.startsWith(id) || txt.includes(id)) found = o;
    });
    return found;
  }
  return null;
}
function applyLayoutToScene(roomId){
  if (applyingRemoteLayout) return;
  const scene = document.querySelector('.scene.active .mobile-room') || document.querySelector('.scene.active');
  if (!scene) return;
  applyingRemoteLayout = true;
  const roomPositions = furnitureOnlyMap((remoteLayout.rooms && remoteLayout.rooms[roomId || currentTab]) || {});
  Object.keys(roomPositions).forEach((key) => {
    const pos = roomPositions[key];
    if (!pos || pos.x == null || pos.y == null) return;
    visualPositions[key] = { x: pos.x, y: pos.y };
    const el = findLayoutEl(scene, key);
    if (el) {
      el.style.transition = 'left 0.35s ease, top 0.35s ease';
      el.style.left = pos.x + '%';
      el.style.top = pos.y + '%';
      setTimeout(() => { if (el) el.style.transition = ''; }, 400);
    }
  });
  applyingRemoteLayout = false;
}
function scheduleLayoutPublish(){
  if (!canEditSceneLayout()) return;
  if (!layoutReadyFromServer) return;
  if (layoutPublishTimer) clearTimeout(layoutPublishTimer);
  layoutPublishTimer = setTimeout(() => publishLayoutRoom(false), 350);

async function publishLayoutRoom(reset){
  if (!canEditSceneLayout() || !isQueueMode()) return;
  if (!layoutReadyFromServer && !reset) return;
  const { houseId } = parseRoute();
  if (!houseId) return;
  const roomPositions = reset ? {} : furnitureOnlyMap(visualPositions);
  const baseRev = Number(remoteLayout.rev || layoutSince || 0) || 0;
  const ts = Date.now();
  const prevRoom = furnitureOnlyMap((remoteLayout.rooms && remoteLayout.rooms[currentTab]) || {});
  const rooms = Object.assign({}, stripPersonKeysFromRooms(remoteLayout.rooms || {}), {
    [currentTab]: reset ? {} : Object.assign({}, prevRoom, roomPositions),
  });
  const localSnap = {
    room: currentTab,
    positions: roomPositions,
    reset: !!reset,
    ts,
    rev: ts,
    baseRev,
    rooms,
  };

  // Live furniture: Supabase. Persist furniture: Worker.
  if (useSupabaseAtmosphere() && window.BLTHouseRealtime) {
    try { await window.BLTHouseRealtime.publishLayout(localSnap); } catch (e) {}
  }
  if (typeof window.BLTHouseExtPublishLayout === 'function') {
    try {
      const payload = reset
        ? { room: currentTab, reset: true, baseRev }
        : { room: currentTab, positions: roomPositions, baseRev };
      const data = await window.BLTHouseExtPublishLayout(payload);
      if (data && data.rooms) {
        remoteLayout = {
          ts: data.ts || Date.now(),
          rev: data.rev || data.ts || 0,
          rooms: stripPersonKeysFromRooms(data.rooms),
        };
        layoutSince = Math.max(layoutSince, remoteLayout.rev);
        mergeLayoutRooms(remoteLayout.rooms);
        layoutReadyFromServer = true;
      }
    } catch (e) {}
  }
}
async function layoutPollLoop(){
  if (window.__bltLayoutLoop) return;
  window.__bltLayoutLoop = true;
  let seeded = false;
  while (window.__bltLayoutLoop) {
    if (!isQueueMode()) { await new Promise((r) => setTimeout(r, 1000)); continue; }
    const { houseId } = parseRoute();
    if (!houseId) { await new Promise((r) => setTimeout(r, 1000)); continue; }
    try {
      const wait = seeded ? (useSupabaseAtmosphere() ? 8000 : 2500) : 0;
      const data = await window.BLTHouseExtFetchLayout(houseId, { since: layoutSince, wait });
      if (data && data.ok !== false && data.rooms) {
        ingestRemoteLayout(data);
        layoutReadyFromServer = true;
      } else if (!seeded) {
        layoutReadyFromServer = true; // empty server layout — allow owner publishes
      }
      seeded = true;
      if (!wait) await new Promise((r) => setTimeout(r, 400));
    } catch (e) {
      seeded = true;
      layoutReadyFromServer = true;
      await new Promise((r) => setTimeout(r, 1000));
    }
  }
}
function ingestRemoteLayout(payload){
  if (!payload) return;
  const rev = Number(payload.rev || payload.ts || Date.now()) || 0;
  remoteLayout.rooms = stripPersonKeysFromRooms(remoteLayout.rooms || {});
  if (payload.rooms) {
    const clean = stripPersonKeysFromRooms(payload.rooms);
    Object.keys(clean).forEach((room) => {
      remoteLayout.rooms[room] = Object.assign({}, remoteLayout.rooms[room] || {}, clean[room] || {});
    });
  }
  if (payload.room && payload.positions) {
    remoteLayout.rooms[payload.room] = Object.assign(
      {},
      remoteLayout.rooms[payload.room] || {},
      furnitureOnlyMap(payload.positions)
    );
  }
  if (payload.reset && payload.room) remoteLayout.rooms[payload.room] = {};
  if (!layoutSince || rev >= layoutSince) {
    remoteLayout.ts = rev || Date.now();
    remoteLayout.rev = rev || remoteLayout.ts;
    layoutSince = Math.max(layoutSince, rev);
  }
  layoutReadyFromServer = true;
  mergeLayoutRooms(remoteLayout.rooms);
  saveVisualPositions();
  applyLayoutToScene(payload.room || currentTab);
}

    renderPresenceOnly();
    try {
      // Live move = Supabase only (publishPresenceDual). Never apply Worker layout/presence echo here.
      await publishPresenceDual({
        pose: 'walk', object: '', room: currentTab, idle: false, x: pos.x, y: pos.y, eventId: newEventId(),
      });
      renderPresenceOnly();
    } catch (e) {}
    setTimeout(async () => {
      if (!presence.actors || !presence.actors[login]) return;
      presence.actors[login].pose = 'here';
      presence.actors[login].x = pos.x;
      presence.actors[login].y = pos.y;
      presence.actors[login].ts = Date.now();
      renderPresenceOnly();
      try {
        await publishPresenceDual({ idle: true, pose: 'here', room: currentTab, x: pos.x, y: pos.y });
      } catch (e) {}
    }, 350);
  } finally {
    window.__bltFlavorBusy = false;
  }
}
function positionKey(kind, id, fallbackX, fallbackY, legacyId){
  const k = kind + ':' + String(id || '');
  let saved = visualPositions[k];
  if ((!saved || typeof saved.x !== 'number') && legacyId && String(legacyId) !== String(id)) {
    const legacyKey = kind + ':' + String(legacyId);
    const legacy = visualPositions[legacyKey];
    if (legacy && typeof legacy.x === 'number' && typeof legacy.y === 'number') {
      saved = legacy;
      visualPositions[k] = { x: legacy.x, y: legacy.y };
    }
  }
  if (saved && typeof saved.x === 'number' && typeof saved.y === 'number') return { x: saved.x, y: saved.y, key: k };
  return { x: fallbackX, y: fallbackY, key: k };
}
function scenePoint(e, scene){
  const r = scene.getBoundingClientRect();
  return { x: ((e.clientX - r.left) / Math.max(1, r.width)) * 100, y: ((e.clientY - r.top) / Math.max(1, r.height)) * 100 };
}
function bindSceneDrag(el, scene, kind, id, basePos){
  el.addEventListener('pointerdown', e => {
    if (sceneMode !== 'move' || !canEditSceneLayout()) return;
    e.preventDefault(); e.stopPropagation();
    const p = scenePoint(e, scene);
    const left = parseFloat(el.style.left) || basePos.x;
    const top = parseFloat(el.style.top) || basePos.y;
    dragState = { el, scene, kind, id, dx: p.x - left, dy: p.y - top };
    el.classList.add('dragging');
    el.setPointerCapture?.(e.pointerId);
  });
  el.addEventListener('pointermove', e => {
    if (!dragState || dragState.el !== el) return;
    if (!canEditSceneLayout()) return;
    const p = scenePoint(e, scene);
    el.style.left = Math.max(1, Math.min(94, p.x - dragState.dx)) + '%';
    el.style.top = Math.max(3, Math.min(90, p.y - dragState.dy)) + '%';
  });
  el.addEventListener('pointerup', () => {
    if (!dragState || dragState.el !== el) return;
    const x = parseFloat(el.style.left) || basePos.x;
    const y = parseFloat(el.style.top) || basePos.y;
    visualPositions[kind + ':' + String(id)] = { x, y };
    saveVisualPositions();
    el.classList.remove('dragging');
    dragState = null;
    scheduleLayoutPublish();
    toast('Позиция сохранена');
  });
}

function setPresence(remote, opts){
  opts = opts || {};
  if(!remote || typeof remote !== 'object') return presence;
  if (!presenceJoinedAt) presenceJoinedAt = Date.now();

  const me = String((window.BLTHouseTwitch && window.BLTHouseTwitch.user && window.BLTHouseTwitch.user.login) || '').toLowerCase();
  const actors = Object.assign({}, presence.actors || {});
  Object.keys(remote.actors || {}).forEach((k) => {
    const a = remote.actors[k];
    const cur = actors[k];
    // Never let a slower Worker snapshot pull OUR avatar backward.
    if (me && String(k).toLowerCase() === me && cur && Number(cur.ts || 0) > Number(a.ts || 0)) {
      return;
    }
    if (!cur || Number(a.ts || 0) >= Number(cur.ts || 0)) {
      actors[k] = Object.assign({}, cur || {}, a, {
        x: a.x != null ? Number(a.x) : (cur && cur.x),
        y: a.y != null ? Number(a.y) : (cur && cur.y),
      });
    }
  });
  const now = Date.now();
  Object.keys(actors).forEach((k) => {
    if (now - Number(actors[k].ts || 0) > 60000) delete actors[k];
  });

  const seedOnly = opts.seedOnly === true;
  const incoming = Array.isArray(remote.events) ? remote.events : [];
  for (const e of incoming) {
    if (!e) continue;
    const id = String(e.id || ((e.ts || '') + ':' + (e.login || '')));
    if (seenEventIds.has(id)) continue;
    seenEventIds.add(id);
    if (seedOnly) continue;
    if (Number(e.ts || 0) + 500 < presenceJoinedAt) continue;
    liveLog.push({
      id,
      text: e.text || ((e.display || e.login || '') + ' · ' + (e.pose || '')),
      ts: Number(e.ts || now),
    });
    const login = String(e.login || '').toLowerCase();
    if (login) {
      const prev = actors[login] || {};
      actors[login] = Object.assign({}, prev, {
        login,
        display: e.display || prev.display || login,
        pose: e.pose || prev.pose || 'here',
        object: e.object || '',
        room: e.room || currentTab,
        x: e.x != null ? Number(e.x) : prev.x,
        y: e.y != null ? Number(e.y) : prev.y,
        ts: Number(e.ts || now),
      });
    }
  }
  while (liveLog.length > 12) liveLog.shift();
  while (seenEventIds.size > 200) {
    const first = seenEventIds.values().next().value;
    seenEventIds.delete(first);
  }

  presence = {
    houseId: remote.houseId || presence.houseId,
    ts: remote.ts || Date.now(),
    rev: Number(remote.rev || remote.eventRev || presence.rev || 0),
    eventRev: Number(remote.eventRev || 0),
    actors,
    events: incoming,
  };
  return presence;
}

function newEventId(){
  try {
    if (crypto && crypto.randomUUID) return crypto.randomUUID();
  } catch (e) {}
  return 'e' + Date.now() + '-' + Math.random().toString(16).slice(2);
}

function useSupabaseAtmosphere(){
  return !!(window.BLTHouseRealtime && window.BLTHouseRealtime.enabled && window.BLTHouseRealtime.enabled());
}

function ingestFlavorEvent(e){
  if (!e) return;
  const id = String(e.id || ((e.ts || '') + ':' + (e.login || '')));
  if (seenEventIds.has(id)) return;
  seenEventIds.add(id);
  liveLog.push({
    id,
    text: e.text || ((e.display || e.login || '') + ' · ' + (e.pose || '')),
    ts: Number(e.ts || Date.now()),
  });
  while (liveLog.length > 12) liveLog.shift();
  const login = String(e.login || '').toLowerCase();
  if (login) {
    presence.actors = presence.actors || {};
    const prev = presence.actors[login] || {};
    presence.actors[login] = Object.assign({}, prev, {
      login,
      display: e.display || prev.display || login,
      pose: e.pose || prev.pose || 'here',
      object: e.object || '',
      room: e.room || currentTab,
      x: e.x != null ? Number(e.x) : prev.x,
      y: e.y != null ? Number(e.y) : prev.y,
      ts: Number(e.ts || Date.now()),
    });
    animatePresenceActor(presence.actors[login]);
  }
}

function applyRealtimeActors(actors){
  ensureSelfPresence();
  const prev = presence.actors || {};
  const next = {};
  Object.keys(actors || {}).forEach((k) => {
    const remote = actors[k];
    const cur = prev[k];
    // Presence sync is source of truth for who is online (join/leave immediate).
    if (!cur || Number(remote.ts || 0) >= Number(cur.ts || 0)) {
      next[k] = Object.assign({}, cur || {}, remote, {
        x: remote.x != null ? Number(remote.x) : (cur && cur.x),
        y: remote.y != null ? Number(remote.y) : (cur && cur.y),
      });
    } else {
      next[k] = Object.assign({}, remote, cur, {
        x: cur.x != null ? cur.x : remote.x,
        y: cur.y != null ? cur.y : remote.y,
      });
    }
  });
  const me = String((window.BLTHouseTwitch && window.BLTHouseTwitch.user && window.BLTHouseTwitch.user.login) || '').toLowerCase();
  // Keep only self if briefly missing from a sync; never keep remote ghosts after leave.
  if (me && prev[me] && !next[me]) next[me] = prev[me];
  if (me && prev[me] && next[me] && Number(prev[me].ts || 0) > Number(next[me].ts || 0)) {
    next[me] = prev[me];
  }
  presence.actors = next;
  presence.ts = Date.now();
  syncPresenceAvatars();
}

function resolveObjectPos(objectName, kind){
  let tx = null;
  let ty = null;
  const want = String(objectName || '').toLowerCase();
  if (lastInteractPos && String(lastInteractPos.name || '').toLowerCase() === want) {
    tx = lastInteractPos.x;
    ty = lastInteractPos.y;
  }
  const scene = document.querySelector('.scene.active .mobile-room') || document.querySelector('.scene.active');
  if ((tx == null || ty == null) && scene) {
    const people = scene.querySelectorAll('.room-person');
    for (const p of people) {
      const nm = String((p.querySelector('.name') && p.querySelector('.name').textContent) || '').toLowerCase();
      if (want && (nm === want || nm.includes(want) || want.includes(nm))) {
        tx = parseFloat(p.style.left);
        ty = parseFloat(p.style.top);
        break;
      }
    }
  }
  if ((tx == null || ty == null) && scene) {
    const objs = scene.querySelectorAll('.object,.furniture');
    for (const o of objs) {
      const lab = o.querySelector('.room-object-label') || o.querySelector('div');
      const txt = String((lab && lab.textContent) || '').toLowerCase();
      if (want && txt.includes(want)) {
        tx = parseFloat(o.style.left);
        ty = parseFloat(o.style.top);
        break;
      }
    }
  }
  if (tx == null || ty == null || isNaN(tx) || isNaN(ty)) {
    tx = 40 + Math.random() * 20;
    ty = 45 + Math.random() * 15;
  }
  const beside = kind === 'person' || kind === 'look' || kind === 'wave';
  const nearX = Math.max(4, Math.min(92, tx + (kind === 'bed' || kind === 'rest' ? 0 : (beside ? (Math.random() < 0.5 ? -7 : 7) : (Math.random() < 0.5 ? -8 : 8)))));
  const nearY = Math.max(8, Math.min(88, ty + (kind === 'bed' || kind === 'rest' ? 4 : (beside ? 2 : 0))));
  return { x: nearX, y: nearY };
}

async function doFlavor(pose, objectName, kind){
  closeInteract();
  if(!twitchLoggedIn()){
    toast('Войди Twitch — атмосфера общая для залогиненных');
    return;
  }
  const left = flavorCdLeft();
  if (left > 0) {
    toast('Подожди ' + (left/1000).toFixed(1) + ' с');
    return;
  }
  if (window.__bltFlavorBusy) return;
  window.__bltFlavorBusy = true;
  startFlavorCooldown();
  const pos = resolveObjectPos(objectName, kind || pose);
  moveSelfToObject(pose, objectName, kind, pos);
  const me = (window.BLTHouseTwitch.user||{}).display || 'ты';
  const login = String((window.BLTHouseTwitch.user||{}).login||'').toLowerCase();
  const eventId = newEventId();
  if (!presence.actors) presence.actors = {};
  presence.actors[login] = {
    login, display: me, pose, object: objectName || '', room: currentTab,
    x: pos.x, y: pos.y, ts: Date.now()
  };
  if (!seenEventIds.has(eventId)) {
    seenEventIds.add(eventId);
    liveLog.push({ id: eventId, text: me + ' · ' + pose + (objectName ? ' · ' + objectName : ''), ts: Date.now() });
    while (liveLog.length > 12) liveLog.shift();
  }
  renderPresenceOnly();
  toast(me+' · '+pose+' · '+objectName);
  setFooter(me + (objectName ? ' · ' + objectName : ''));
  try{
    const payload = {
      pose, object: objectName, room: currentTab, text: '', eventId, idle: false,
      x: pos.x, y: pos.y,
    };
    if (useSupabaseAtmosphere()) {
      await publishPresenceDual(payload);
      refreshGameStatusUi();
    } else {
      const data = await window.BLTHouseExtPublishPresence(payload);
      setPresence(data);
      renderPresenceOnly();
      refreshGameStatusUi();
    }
  }catch(e){
    toast(humanQueueError(e));
    setFooter(humanQueueError(e));
    refreshGameStatusUi();
  } finally {
    window.__bltFlavorBusy = false;
  }
}

function ensureSelfPresence(){
  if (!twitchLoggedIn()) return null;
  const u = window.BLTHouseTwitch.user || {};
  const login = String(u.login || '').toLowerCase();
  if (!login) return null;
  presence.actors = presence.actors || {};
  if (!presence.actors[login]) {
    presence.actors[login] = {
      login,
      display: u.display || login,
      pose: 'here',
      object: '',
      room: currentTab,
      ts: Date.now(),
    };
  } else {
    presence.actors[login].ts = Date.now();
    if (!presence.actors[login].display) presence.actors[login].display = u.display || login;
  }
  return login;
}

function findSelfPersonEl(scene){
  if (!scene) scene = document.querySelector('.scene.active');
  if (!scene) return null;
  const t = window.BLTHouseTwitch || {};
  const login = String((t.user && t.user.login) || '').toLowerCase();
  if (login) {
    const byLogin = scene.querySelector('.room-person[data-presence-login="'+cssEsc(login)+'"]');
    if (byLogin) return byLogin;
  }
  const display = String((t.user && t.user.display) || '').toLowerCase();
  const people = scene.querySelectorAll('.room-person');
  for (const el of people) {
    const nm = String((el.querySelector('.name') && el.querySelector('.name').textContent) || '').toLowerCase();
    if (login && nm.includes(login)) return el;
    if (display && nm.includes(display)) return el;
  }
  return null;
}

function findOrCreatePresenceAvatar(scene, actor){
  if (!scene || !actor) return null;
  const login = String(actor.login || '').toLowerCase();
  if (!login) return null;
  let el = scene.querySelector('.room-person[data-presence-login="'+cssEsc(login)+'"]');
  if (el) return el;
  const display = String(actor.display || login).toLowerCase();
  const people = scene.querySelectorAll('.room-person');
  for (const p of people) {
    const nm = String((p.querySelector('.name') && p.querySelector('.name').textContent) || '').toLowerCase();
    if (nm.includes(login) || (display && nm.includes(display))) {
      p.dataset.presenceLogin = login;
      return p;
    }
  }
  el = document.createElement('div');
  el.className = 'room-person presence-visitor guest';
  el.dataset.presenceLogin = login;
  el.dataset.personId = 'presence:' + login;
  el.dataset.layoutKey = 'person:presence:' + login;
  const x = actor.x != null ? Number(actor.x) : (20 + Math.random() * 50);
  const y = actor.y != null ? Number(actor.y) : (40 + Math.random() * 30);
  el.style.left = x + '%';
  el.style.top = y + '%';
  el.innerHTML = `<div class="body"></div><div class="name">${esc(actor.display || login)}</div><div class="state">${esc(actor.pose || 'здесь')}</div>`;
  el.onclick = (ev) => {
    if (sceneMode === 'move') return;
    ev.stopPropagation();
    openInteract(ev, actor.display || login, actor.pose || 'в панели', el, 'person');
  };
  scene.appendChild(el);
  return el;
}

function animatePresenceActor(actor){
  const scene = document.querySelector('.scene.active .mobile-room') || document.querySelector('.scene.active');
  if (!scene || !actor) return;
  const me = String((window.BLTHouseTwitch && window.BLTHouseTwitch.user && window.BLTHouseTwitch.user.login) || '').toLowerCase();
  const login = String(actor.login || '').toLowerCase();
  // Always animate remotes; self already moved locally in doFlavor
  const el = findOrCreatePresenceAvatar(scene, actor);
  if (!el) return;
  const st = el.querySelector('.state');
  if (st) st.textContent = actor.pose === 'rest' ? 'отдыхает' : (actor.pose || 'здесь');
  if (actor.x != null && actor.y != null && !isNaN(Number(actor.x)) && !isNaN(Number(actor.y))) {
    if (login !== me) {
      el.style.transition = 'left 0.45s ease, top 0.45s ease';
      el.style.left = Number(actor.x) + '%';
      el.style.top = Number(actor.y) + '%';
      setTimeout(() => { el.style.transition = ''; }, 500);
    }
  }
}

function syncPresenceAvatars(){
  const scene = document.querySelector('.scene.active .mobile-room') || document.querySelector('.scene.active');
  if (!scene) return;
  const actors = Object.values((presence && presence.actors) || {});
  const live = new Set();
  actors.forEach(a => {
    const login = String(a.login || '').toLowerCase();
    if (!login) return;
    if (a.room && a.room !== currentTab && a.pose === 'here') {
      // still show in bar, but only animate if same room or has coords
    }
    live.add(login);
    animatePresenceActor(a);
  });
  scene.querySelectorAll('.room-person.presence-visitor').forEach(el => {
    const login = String(el.dataset.presenceLogin || '').toLowerCase();
    if (login && !live.has(login)) el.remove();
  });
}

function moveSelfToObject(pose, objectName, kind, forcedPos){
  const scene = document.querySelector('.scene.active .mobile-room') || document.querySelector('.scene.active');
  if (!scene) return null;
  const pos = forcedPos || resolveObjectPos(objectName, kind || pose);
  let el = findSelfPersonEl(scene);
  if (!el && twitchLoggedIn()) {
    const u = window.BLTHouseTwitch.user || {};
    el = findOrCreatePresenceAvatar(scene, {
      login: String(u.login || '').toLowerCase(),
      display: u.display || u.login,
      pose, x: pos.x, y: pos.y,
    });
  }
  if (!el) return null;
  el.style.transition = 'left 0.45s ease, top 0.45s ease';
  el.style.left = pos.x + '%';
  el.style.top = pos.y + '%';
  const st = el.querySelector('.state');
  if (st) st.textContent = pose === 'rest' ? 'отдыхает' : (pose || 'здесь');
  const id = el.dataset.personId || el.dataset.presenceLogin || 'self';
  visualPositions['person:' + id] = { x: pos.x, y: pos.y };
  saveVisualPositions();
  setTimeout(() => { el.style.transition = ''; }, 500);
  return pos;
}

function drawPresence(scene){
  const me = ensureSelfPresence();
  const bar=document.createElement('div');
  bar.className='presence-bar';
  const actors=Object.values((presence&&presence.actors)||{});
  if(!actors.length){
    return;
  }
  bar.innerHTML=actors.map(a=>{
    const self = me && String(a.login||'').toLowerCase()===me;
    const bit=[a.display||a.login, self && !(a.pose&&a.pose!=='here') ? 'здесь' : a.pose, a.object].filter(Boolean).join(' · ');
    return `<div class="presence-chip">${esc(bit)}</div>`;
  }).join('');
  scene.appendChild(bar);
}

function renderPresenceOnly(){
  const scene=document.querySelector('.scene.active');
  if(!scene) return;
  const old=scene.querySelector('.presence-bar');
  if(old) old.remove();
  drawPresence(scene);
  syncPresenceAvatars();
  const log=document.getElementById('presenceLog');
  if(log){
    const actors = Object.values((presence && presence.actors) || {});
    const online = actors.map(a => {
      const bit = [a.display || a.login, a.pose && a.pose !== 'here' ? a.pose : 'здесь', a.object].filter(Boolean).join(' · ');
      return '<div style="margin:2px 0">● ' + esc(bit) + '</div>';
    }).join('');
    const ev = liveLog.slice(-5).reverse();
    const act = ev.length
      ? '<div style="margin-top:8px;color:#8f887c">Активность</div>' + ev.map(e=>'<div>'+esc(e.text||'')+'</div>').join('')
      : '';
    if (online) log.innerHTML = online + act;
    else if (twitchLoggedIn()) log.textContent = 'Ты в панели · кликни объект, чтобы появилось действие';
    else log.textContent = 'Войди Twitch, чтобы тебя было видно';
  }
}

async function pollPresenceOnce(){
  if(!isQueueMode() || typeof window.BLTHouseExtPublishPresence !== 'function') return;
  // With Supabase live, Worker heartbeat is optional backup only — do not apply snapshot to DOM.
  if (useSupabaseAtmosphere()) {
    if(twitchLoggedIn() && Date.now()-(window.__bltPresenceBeat||0)>15000){
      window.__bltPresenceBeat=Date.now();
      const u = window.BLTHouseTwitch.user || {};
      const mine = (presence.actors||{})[String(u.login||'').toLowerCase()];
      window.BLTHouseExtPublishPresence({
        idle: true,
        pose: (mine && mine.pose) || 'here',
        object: (mine && mine.object) || '',
        room: currentTab,
        x: mine && mine.x != null ? mine.x : null,
        y: mine && mine.y != null ? mine.y : null,
      }).catch(()=>{});
    }
    return;
  }
  const {houseId}=parseRoute();
  if(!houseId) return;
  try{
    if(twitchLoggedIn() && Date.now()-(window.__bltPresenceBeat||0)>8000){
      window.__bltPresenceBeat=Date.now();
      const u = window.BLTHouseTwitch.user || {};
      const mine = (presence.actors||{})[String(u.login||'').toLowerCase()];
      window.BLTHouseExtPublishPresence({
        idle: true,
        pose: (mine && mine.pose) || 'here',
        object: (mine && mine.object) || '',
        room: currentTab,
        x: mine && mine.x != null ? mine.x : null,
        y: mine && mine.y != null ? mine.y : null,
      }).then(d=>{
        if (!d) return;
        setPresence(d);
        renderPresenceOnly();
      }).catch(()=>{});
    }
  }catch(e){}
}

async function presenceLongPollLoop(){
  if (window.__bltPresenceLoop) return;
  // Supabase is the live atmosphere channel — do not long-poll Worker (causes lag + rollback).
  if (useSupabaseAtmosphere()) return;
  window.__bltPresenceLoop = true;
  presenceJoinedAt = Date.now();
  seenEventIds = new Set();
  liveLog = [];
  let since = 0;
  let seeded = false;
  while (window.__bltPresenceLoop) {
    if (!isQueueMode()) { await new Promise(r=>setTimeout(r,1000)); continue; }
    const {houseId}=parseRoute();
    if (!houseId) { await new Promise(r=>setTimeout(r,1000)); continue; }
    try {
      const wait = seeded ? 2500 : 0;
      const data = await window.BLTHouseExtFetchPresence(houseId, { since, wait });
      if (data && data.ok !== false) {
        if (!seeded) {
          setPresence(data, { seedOnly: true });
          seeded = true;
          renderPresenceOnly();
        } else {
          setPresence(data);
          renderPresenceOnly();
        }
        // Furniture only — never people from presence piggyback.
        if (data.layout) ingestRemoteLayout(data.layout);
        const rev = Number(data.rev || 0);
        if (rev > since) since = rev;
        else if (!since) since = Number(data.eventRev || data.ts || Date.now());
      }
      await pollPresenceOnce();
    } catch (e) {
      await new Promise(r=>setTimeout(r, 300));
    }
  }
}

function placePeople(scene, people){
  const slots=[[61,47],[25,52],[45,58],[72,45],[33,40]];
  (people||[]).slice(0,8).forEach((p,i)=>{
    const [sx,sy]=slots[i]||[15+(i%4)*20, 45+Math.floor(i/4)*12];
    const id=p.heroId||p.HeroId||p.name||p.Name||('person_'+i);
    const pos=positionKey('person', id, sx, sy);
    const el=document.createElement('div');
    const isGuest=!!(p.isGuest||p.IsGuest||String(p.role||p.Role||'').toLowerCase().includes('гост'));
    el.className='room-person'+(isGuest?' guest':'');
    el.dataset.personId = String(id);
    el.dataset.layoutKey = 'person:' + String(id);
    el.style.left=pos.x+'%'; el.style.top=pos.y+'%';
    el.innerHTML=`<div class="body"></div><div class="name">${esc(p.name||p.Name||'?')}</div><div class="state">${esc(p.state||p.State||p.role||p.Role||'')}</div>`;
    el.onclick=(ev)=>{
      if(sceneMode==='move') return;
      ev.stopPropagation();
      openInteract(ev, p.name||p.Name||'Персонаж', p.state||p.role||'', el, 'person');
      inspectPerson(p);
    };
    bindSceneDrag(el, scene, 'person', id, pos);
    scene.appendChild(el);
  });
}

function inspectPerson(p){

  setFooter(`${p.name} — ${bits.join(' · ')}`);

let shopShown = { goods: 80, clothes: 80 };
const SHOP_PAGE = 80;

function shopList(kind){
  const owner = canRunGameActions();
  const all = house.shopItems||[];
  const wantClothes = String(kind||'').toLowerCase() === 'clothes';
  const key = wantClothes ? 'clothes' : 'goods';
  const items = all.filter(it => {
    const k = String(it.ShopKind||it.shopKind||'goods').toLowerCase();
    return wantClothes ? k === 'clothes' : k !== 'clothes';
  });
  if (!items.length) {
    return '<div class="list-item">'+(esc(house.shopStatus)||(wantClothes?'Нет гражданской одежды в складе города':'Нет Goods в складе города'))+'</div>';
  }
  const limit = Math.max(SHOP_PAGE, Number(shopShown[key]) || SHOP_PAGE);
  const shown = items.slice(0, limit);
  let html = shown.map((it)=>{
    const id=it.ItemStringId||it.itemStringId||'';
    const name=it.Name||it.name||id;
    const price=it.UnitPrice||it.unitPrice||0;
    const avail=it.Available||it.available||0;
    const sk=it.ShopKind||it.shopKind||'goods';
    const globalIdx = all.indexOf(it);
    const inspect=`<button type="button" class="btn-inspect" data-ui="inspect" data-src="shop" data-idx="${escAttr(String(globalIdx))}">Осмотреть</button>`;
    const btns=`<span class="row-acts">${inspect}${owner&&id?`
      <button type="button" class="btn-sell" data-ui="act" data-action="buy_shop_item" data-target="${escAttr(String(id))}" data-value="1">Купить · ${price}</button>`:''}
    </span>`;
    return `<div class="list-item"><img class="ico" src="${wantClothes?'assets/icons/armor.svg':'assets/icons/misc.svg'}" alt=""><div class="txt"><b>${esc(name)}</b><small>${esc(sk)} · ${esc(id)} · на рынке ${avail} · цена ${price}</small></div>${btns}</div>`;
  }).join('');
  const total = wantClothes ? Number(house.shopClothesTotal||0) : Number(house.shopGoodsTotal||0);
  const haveMore = (total > 0 && items.length < total) || items.length > shown.length;
  if (haveMore) {
    const left = total > items.length ? (total - items.length) : (items.length - shown.length);
    html += `<button type="button" class="action" data-ui="shop-more" data-kind="${escAttr(key)}" style="margin-top:8px">Показать ещё (~${left})</button>`;
  }
  return html;
}

function actionsHtml(room){
  const shopTab = isShopTab(room);
  const acts=(house.actions||[]).filter(a=>{
    if (!a.room) return true;
    if (a.room===room) return true;
    if (room==='common'&&a.room==='overview') return true;

    return false;
  });

  const offlineNotice = (isQueueMode() && isPanelOwner() && !isGameOnline())
    ? '<div class="notice warn">Игра оффлайн — улучшения, крафт и магазин недоступны, пока Bannerlord не запущен с модом.</div>'
    : '';

    const hint=a.hint?`<span class="hint">${esc(a.hint)}</span>`:'';
    const cmd=a.command?`<span class="hint">${esc(a.command)}</span>`:'';
    return `<button type="button" class="action" data-ui="house-action" data-action-id="${escAttr(a.id||'')}" ${dis?'disabled':''}>${esc(a.label)} ${cost}${hint}${cmd}</button>`;
  }).join('');
